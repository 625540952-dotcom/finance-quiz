<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#4a7bf7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="财报题库">
<title>财务报表分析 · 平时测验题库</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#f2f4f8;color:#1f2430;overscroll-behavior-y:none;
 font:16px/1.7 -apple-system,"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif}
body.hasfoot{padding-bottom:86px}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:21px;margin:6px 0 4px;letter-spacing:.5px;line-height:1.45}
.sub{color:#7b8496;font-size:13.5px;margin:0 0 16px;line-height:1.65}
.cards{display:grid;gap:12px}
@media(min-width:700px){.cards{grid-template-columns:1fr 1fr}}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(24,39,75,.09);
 padding:15px 17px}
.entry{cursor:pointer;transition:.15s;border:1px solid transparent}
.entry:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(24,39,75,.14);
 border-color:#c8d5f5}
.entry.wide{grid-column:1/-1}
.entry h3{margin:0 0 6px;font-size:16.5px;color:#1b3a8f}
.entry p{margin:0;color:#7b8496;font-size:13.5px}
.entry .badge{display:inline-block;background:#eef2fd;color:#2b52b8;border-radius:20px;
 font-size:12px;padding:1px 9px;margin-left:6px;vertical-align:2px}
.stats{margin-top:16px;color:#7b8496;font-size:13px;text-align:center;line-height:1.9}
.stats a{color:#b04a4a;text-decoration:none;margin-left:8px}
.warn{background:#fff8e6;border:1px solid #f0dfae;color:#8a6d1f;border-radius:10px;
 padding:12px 14px;font-size:13.5px;line-height:1.75;margin-top:14px}
.warn b{color:#7a5c0d}
.okbox{background:#eefaf1;border:1px solid #cbe9d7;color:#2c7a4f;border-radius:10px;
 padding:11px 14px;font-size:13.5px;line-height:1.7;margin-top:14px}
.topbar{position:sticky;top:0;z-index:6;background:rgba(242,244,248,.97);
 backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
 display:flex;align-items:center;gap:10px;font-size:14px;
 padding:9px 0;margin:-9px 0 8px;border-bottom:1px solid rgba(226,231,241,.8)}
.topbar .back{color:#2b52b8;cursor:pointer;text-decoration:none;white-space:nowrap}
.topbar .mode{color:#1f2430;font-weight:600;white-space:nowrap;overflow:hidden;
 text-overflow:ellipsis}
.topbar .pos{margin-left:auto;color:#7b8496;white-space:nowrap}
.bar{height:5px;background:#e2e7f1;border-radius:4px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4a7bf7,#7aa2ff);
 border-radius:4px;transition:width .25s}
.q{position:relative;padding-top:20px}
.tag{position:absolute;top:-1px;right:15px;background:#eef2fd;color:#2b52b8;
 font-size:11.5px;padding:1px 9px;border-radius:0 0 8px 8px}
.stem{font-size:17px;font-weight:600;line-height:1.78;margin-bottom:15px;
 white-space:pre-wrap;word-break:break-word}
.mhint{background:#fff8e6;border:1px solid #f0dfae;color:#8a6d1f;border-radius:9px;
 padding:9px 13px;font-size:13.5px;line-height:1.6;margin-bottom:12px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;margin-bottom:9px;
 border:1.5px solid #e2e7f1;border-radius:10px;cursor:pointer;transition:.13s;
 background:#fcfdff;touch-action:manipulation}
.opt:active{transform:scale(.99)}
.opt b{flex:0 0 24px;height:24px;line-height:24px;text-align:center;border-radius:50%;
 background:#eef2fd;color:#2b52b8;font-size:13px;font-weight:700;margin-top:1px}
.opt span{flex:1}
.opt.sel{border-color:#4a7bf7;background:#f2f6ff}
.opt.sel b{background:#4a7bf7;color:#fff}
.opt.right{border-color:#39a56a;background:#eefaf1}
.opt.right b{background:#39a56a;color:#fff}
.opt.wrong{border-color:#d9534f;background:#fdeeee}
.opt.wrong b{background:#d9534f;color:#fff}
.opt.locked{cursor:default}
.opt.locked:active{transform:none}
.fb{margin:14px 0 12px;padding:10px 14px;border-radius:10px;font-weight:600;font-size:15px;
 line-height:1.65}
.fb.ok{background:#eefaf1;color:#2c7a4f}
.fb.no{background:#fdeeee;color:#b0392f}
.expl{padding:14px 17px;background:#fffdf5;border:1px solid #f0e6c8}
.expl .eh{font-size:13px;color:#a08a3c;font-weight:700;margin-bottom:6px}
.expl .et{font-size:14.5px;line-height:1.85;color:#4a4a52;white-space:pre-wrap}
.nav{display:flex;gap:10px;margin-top:16px}
.nav button{flex:1;padding:13px 8px;border:none;border-radius:10px;background:#4a7bf7;
 color:#fff;font:inherit;font-size:15px;cursor:pointer;transition:.13s;
 touch-action:manipulation}
.nav button:active{background:#3a68db}
.nav button:disabled{background:#c9d2e3;cursor:default}
.nav button.ghost{flex:0 0 92px;background:#fff;color:#4a5a7a;border:1.5px solid #dbe2ee}
.nav button.ghost:active{background:#f0f4fb}
.witem{padding:12px 16px;margin-bottom:10px;cursor:pointer;transition:.13s}
.ovtabs{display:flex;gap:8px;margin:0 0 14px}
.ovtabs button{flex:1;padding:8px 4px;border:1.5px solid #dbe2ee;border-radius:9px;
 background:#fff;font:inherit;font-size:13px;color:#4a5a7a;cursor:pointer;
 line-height:1.35;touch-action:manipulation}
.ovtabs button b{display:block;font-size:15.5px;color:#1f2430;margin-top:1px}
.ovtabs button.on{background:#4a7bf7;border-color:#4a7bf7;color:#eaf0ff}
.ovtabs button.on b{color:#fff}
.legend{font-size:12.5px;color:#7b8496;margin:0 0 10px;line-height:2}
.legend .lg{display:inline-block;width:11px;height:11px;border-radius:3px;
 margin:0 4px 0 12px;vertical-align:-1px;border:1.5px solid #e2e7f1}
.legend .lg:first-child{margin-left:0}
.legend .lg.r{background:#eefaf1;border-color:#39a56a}
.legend .lg.w{background:#fdeeee;border-color:#d9534f}
.legend .lg.t{background:#f7f8fb}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.ovcell{height:46px;display:flex;align-items:center;justify-content:center;
 border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;
 border:1.5px solid #e2e7f1;background:#fff;color:#5a6478;touch-action:manipulation}
.ovcell:active{transform:scale(.96)}
.ovcell.r{border-color:#39a56a;background:#eefaf1;color:#2c7a4f}
.ovcell.w{border-color:#d9534f;background:#fdeeee;color:#b0392f}
.ovcell.t{background:#f7f8fb;color:#9aa3b2}
.autohint{display:block;font-weight:400;font-size:12.5px;color:#5a7a63;
 margin-top:6px;text-decoration:underline;cursor:pointer}
.witem:active{border-color:#a9c0f0}
.witem .ws{font-size:15px;font-weight:600;margin-bottom:5px;line-height:1.65}
.witem .wm{font-size:12.5px;color:#7b8496}
.witem .wm em{color:#d9534f;font-style:normal}
.empty{text-align:center;color:#8f98a8;padding:52px 20px;font-size:15px;line-height:2}
.result{text-align:center;padding:30px 20px}
.result .big{font-size:46px;font-weight:700;color:#2b52b8;line-height:1.2}
.result .lbl{color:#7b8496;font-size:14px;margin-bottom:20px}
.rbars{max-width:420px;margin:0 auto 20px;text-align:left;font-size:14px}
.rbars div{display:flex;justify-content:space-between;padding:7px 0;
 border-bottom:1px solid #eef1f6}
.kbd{font-size:12.5px;color:#9aa3b2;text-align:center;margin-top:24px;line-height:1.9}
.kbd kbd{background:#eef1f6;border-radius:4px;padding:1px 6px;font-family:inherit;color:#5a6478}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:7;
 background:rgba(242,244,248,.98);border-top:1px solid #e2e7f1;
 padding:9px 16px calc(9px + env(safe-area-inset-bottom));display:flex;gap:10px}
.foot button{flex:1;padding:11px 8px;border:none;border-radius:10px;background:#4a7bf7;
 color:#fff;font:inherit;font-size:14.5px;cursor:pointer;touch-action:manipulation}
.foot button.g{background:#fff;color:#4a5a7a;border:1.5px solid #dbe2ee}
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(20,26,40,.45);
 display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
.ovbox{background:#fff;border-radius:14px;padding:19px;max-width:440px;width:100%;
 max-height:86vh;overflow:auto;box-shadow:0 14px 44px rgba(0,0,0,.28)}
.ovt{font-size:17px;font-weight:700;margin-bottom:9px}
.ovm{font-size:14px;color:#4a4a52;line-height:1.78}
.ovm p{margin:0 0 6px}
.ovin{width:100%;padding:11px;border:1.5px solid #dbe2ee;border-radius:9px;
 font:inherit;font-size:16px;margin-top:10px}
.ovta{width:100%;height:132px;padding:10px;border:1.5px solid #dbe2ee;border-radius:9px;
 font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;margin-top:10px;
 word-break:break-all;resize:none;-webkit-user-select:all;user-select:all}
.ovb{display:flex;gap:10px;margin-top:15px}
.ovb button{flex:1;padding:12px;border:none;border-radius:9px;background:#4a7bf7;
 color:#fff;font:inherit;font-size:15px;cursor:pointer;touch-action:manipulation}
.ovb button.ghost{background:#fff;color:#4a5a7a;border:1.5px solid #dbe2ee}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);
 background:rgba(30,36,50,.93);color:#fff;padding:10px 18px;border-radius:22px;
 font-size:13.5px;max-width:82%;text-align:center;line-height:1.6;
 opacity:0;transition:opacity .22s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
</style>
</head>

营活动现金净流量大于零且能够补偿当期发生的非付现成本意味企业可以抽出长期资金进行投资，从而增加企业的竞争能力"],"a":[1],"e":"该题考查经营活动现金流量整体质量分析的理解。经营活动现金净流量等于零意味着经营过程中的现金“收支平衡”，长此以往不仅使得企业长期投资无法实施，而且对简单再生产的维持也只能停留在短期内，这种情况对企业发展是不利的。所以B项是正确选项。"},{"k":1,"d":0,"t":1,"s":"意味着经营过程的现金流转存在问题，经营中“入不敷出”，这是最糟糕的情况。这种情况，企业不仅不能长期发展，甚至难以短期内进行简单再生产。是（）情况的反应。","o":["经营活动现金净流量等于零","经营活动现金净流量大于零","投资活动现金流量大于零","经营活动现金净流量小于零"],"a":[3],"e":"该题考查会计信息的质量特征的理解。经营活动现金净流量小于零，意味着经营过程的现金流转存在问题，经营中“入不敷出”，这是最糟糕的情况。这种情况，企业不仅不能长期发展，甚至难以短期内进行简单再生产。所以D项是正确选项。"},{"k":1,"d":0,"t":1,"s":"（）目的是选择未来具有优良业绩和成长性的投资对象。","o":["信用分析","经营决策分析","投资分析","预测分析"],"a":[2],"e":"该题考查确立分析目标，明确分析内容财务分析程序的理解。投资分析目的一选择未来具有优良业绩和成长性的投资对象。信用分析目的主要分析企业偿债能力，保证在未来安全收回本金和利息。经营决策分析目的一一企业的生产能力分析、生产结构分析、内部投资项目分析、成本费用构成分析等。所以C项是正确选项。"},{"k":1,"d":0,"t":1,"s":"下列项目中不属于营业外支出的是（）","o":["处置固定资产净损失","出售固定资产净损失","无形资产摊销","捐赠支出"],"a":[2],"e":"该题考查营业外支出和管理费用的理解。无形资产摊销应计入管理费用。所以C项是正确选项。"},{"k":1,"d":0,"t":1,"s":"以被合并方所有者权益的账面价值为基础确认企业的长期股权投资，对于长期股权投资的账面价值与企业为取得投资而支付的补价之间的差额作为（）项目处理","o":["实收资本","资本公积","盈余公积","本年利润"],"a":[1],"e":"认企业的长期股权投资，对于长期股权投资的账面价值与企业为取得投资而支付的补价之间的差额作为资本公积项目处理。所以B项是正确选项。"},{"k":1,"d":0,"t":1,"s":"（）本身并不产生任何关于企业财务状况和经营成果的信息，但是可以增加财务信息的可信性。","o":["市场信息","审计报告","公司治理信息","宏观经济信息"],"a":[1],"e":"该题考查非会计信息的理解。审计报告：审计报告本身并不产生任何关于企业财务状况和经营成果的信息，但是可以增加财务信息的可信性。所以B项是正确选项。"},{"k":1,"d":0,"t":1,"s":"交易性金融资产持有的目的是为了近期内出售获利，所以交易性金融资产应按照（）计价。","o":["重置成本","历史成本","沉没成本","公允价值"],"a":[3],"e":"该题考查对交易性金融资产持有目的的理解。交易性金融资产持有的目的是为了近期内出售获利，所以交易性金融资产应按照公允价值计价。所以D项是正确选项。"},{"k":1,"d":0,"t":1,"s":"便于分析评价净利润质量的是（）","o":["现金流量表主表","采用直接法编制的现金流量表","比较现金流量表","采用间接法编制的现金流量表"],"a":[3],"e":"该题考查编制现金流量表时，列报经营活动现金流量的方法的理解。间接法：是指以净利润为起点，调整不涉及现金的收入、费用、营业外收支等项目，剔除投资活动、筹资活动对现金流量的影响，据此计算出经营活动产生现金流量。这种方法便于将净利润与经营活动产生的现金流量净额进行比较，了解净利润与经营活动产生的现金流量差异的原因，从现金流量的角度分析净利润的质量。所以D项是正确选项。"},{"k":1,"d":0,"t":1,"s":"财务分析的基本方法中通过顺序变换各个因素的数量，来计算各个因素的变动对总的经济指标的影响程度的一种方法叫（）","o":["比较分析法","比率分析法","因素分析法","趋势分析法"],"a":[2],"e":"该题考查对财务分析基本方法中因素分析法的理解。因素分析法是通过顺序变换各人因素的数量，来计算各人因素的变动对总的经济指标的影响程度的一种方法。所以C项是正确选项。"},{"k":1,"d":0,"t":1,"s":"以下属于外部报送信息是（）","o":["资产负债表","成本计算表","期间费用报表","企业预算"],"a":[0],"e":"该题考查财务信息内容会计信息的理解。BCD都属于内部报送信息。所以A项是正确选项。"},{"k":1,"d":0,"t":1,"s":"当前我国财务报告基本分为会计报表和报表附注两部分，财务信息披露方式包括（）和表外披露。","o":["自愿性披露","强制性披露","表内披露","表中披露"],"a":[2],"e":"该题考查财务信息披露格式的理解。当前我国财务报告基本分为会计报表和报表附注两部分，财务信息披露方式包括：（1）表内披露：披露的信息相对固定，格式清晰，是财务分析关注的重点（2）表外披露：格式不规范，披露灵活，便于吸收新信息，对报表起补充和说明的作用；财务信息的披露意愿包括：（1）自愿性披露：但这种信息不规范，需要财务分析者关注其质量。（2）强制性披露：披露的信息规范性较好，但是可通过分析进一步获取的信息内容相对较少。所以C项是正确选项。"},{"k":1,"d":0,"t":1,"s":"（）是指要求企业应当以实际发生的交易或事项为依据进行会计确认、计量和报告。","o":["可比性","实质重于形式","可靠性","重要性"],"a":[2],"e":"该题考查会计信息质量特征的理解。可靠性是指要求企业应当以实际发生的交易或事项为依据进行会计确认、计量和报告。所以C项是正确选项。"},{"k":1,"d":0,"t":1,"s":"（）关注企业数据与企业现实经济状况的吻合程度。","o":["会计报表质量分析","会计报表趋势分析","会计报表结构分析","财务综合分析"],"a":[0],"e":"该题考查会计报表解读种类的理解。会计报表解读种类有：会计报表质量分析一一关注企业数据与企业现实经济状况的吻合程度。会计报表趋势分析一一揭示各期企业经济行为的性质和发展方向。会计报表结构分析一一从整体上了解企业财务状况的构成，利润形成的过程和现金流量的来源。财务综合分析就是解释各种财务能力之间相互关系，得出企业整体的财务状况及效果结论，说明企业总体目标的事项情况。财务综合分析采用的具体方法有：杜邦分析法、沃尔评分法。所以A项是正确选项。"},{"k":1,"d":0,"t":1,"s":"下列选项中，属于经营活动产生的现金流量是（）","o":["购置固定资产收回的现金净额","分配股利所支付的现金","借款所收到的现金","购买商品支付的现金"],"a":[3],"e":"该题考查对经营活动现金流量的理解。购买商品、接受劳务支付的现金，是经营活动所产生的现金流量。所以D项是正确选项。"},{"k":1,"d":0,"t":1,"s":"（）是指企业长期资产的购建和不包括在现金等价物范围内的投资及其处置活动。","o":["支付活动现金流量","经营活动现金流量","筹资活动现金流量","投资活动现金流量"],"a":[3],"e":"该题考查现金流量表分类的理解。经营活动是指企业投资活动和筹资活动以外的所有交易和事项。投资活动是指企业长期资产的购建和不包括在现金等价物范围内的投资及其处置活动。筹资活动是指导致企业资本及债务规模和构成发生变化的活动。所以D项是正确选项。"},{"k":1,"d":0,"t":1,"s":"可直接出售的商品存货是根据（）的方法来确定可变现净值。","o":["可变现净值=存货的估计售价－估计销售费用和相关税费","可变现净值=合同售价－至完工估计将要发生的成本－销售估计销售费用和相关税费","可变现净值=存货的合同售价－估计销售费用和相关税费","可变现净值=产品估计售价－至完工估计将要发生的成本－销售产品估计的销售费用和相关税费"],"a":[0],"e":"该题考查对存货可变现净值的确定方法的理解。①可直接出售的商品存货：可变现净值=存货的估计售价－估计销售费用和相关税费②需要经过加工的材料存货：可变现净值=产品估计售价－至完工估计将要发生的成本－销售产品估计的销售费用和相关税费③为执行合同或劳务合同而持有的存货：直接出售：可变现净值=存货的合同售价－估计销售费用和相关税费。所以A项是正确选项。"},{"k":1,"d":0,"t":1,"s":"对企业来说，（）是企业创造利润的核心，最具有未来的可持续性。","o":["营业收入","营业成本","投资收益","每股收益"],"a":[0],"e":"该题考查利润表结构内容的理解。营业收入是企业创造利润的核心，最具有未来的可持续性。所以A项是正确选项。"},{"k":1,"d":0,"t":1,"s":"（）指普通股股东所持有一股所能享受的企业利润或需承担的企业风险，该指标在新准则中第一次被纳入利润表披露，每股收益通常被采用反映企业的经营成果，衡量普通股的获利水平及投资风险，是投资者、债权人等信息使用者据以评价企业盈利能力、预测企业成长潜力、进而做出的相关经济决策的一项重要的财务指标。","o":["每股收益","基本每股收益","稀释每股收益","投资收益"],"a":[0],"e":"入利润表披露，每股收益通常被采用反映企业的经营成果，衡量普通股的获利水平及投资风险，是投资者、债权人等信息使用者据以评价企业盈利能力、预测企业成长潜力、进而做出的相关经济决策的一项重要的财务指标。所以A项是正确选项。"},{"k":1,"d":0,"t":1,"s":"某企业20×7年3月31日，乙存货的实际成本为100万元，加工该存货至完工产成品估计还将发生成本为20万元，估计销售费用和相关税费为2万元，估计用该存货生产的产成品售价110万元。则乙存货的可变现净值为（）万元","o":["90","100","108","88"],"a":[3],"e":"品估计的销售费用和相关税费。该题=110-20-2=88万元。所以D项是正确选项。"},{"k":1,"d":0,"t":1,"s":"到期日固定、回收金额固定或可确定，且企业有明确意图和能力持有至到期的非衍生金融资产，一般指（）","o":["长期股权投资","长期债券投资","持有至到期投资","可供出售金融资产投资"],"a":[2],"e":"该题考查对持有至到期投资含义的理解。持有至到期投资是指到期日固定、回收金额固定或可确定，且企业有明确意图和能力持有至到期的非衍生金融资产，一般指长期债券投资。所以C项是正确选项。"},{"k":1,"d":0,"t":1,"s":"初创期和成长期，金额较大的投资活动现金流量是（）","o":["处置长期资产收到的现金","处置子公司收到的现金","购建长期资产支付的现金","投资支付的现金"],"a":[2],"e":"该题考查投资活动现金流量质量分析的理解。不同经营周期的企业在该项目上发生的金额也不同，一般处于初创期和成长期的企业投资较多，本项目发生金额较大，而在衰退期的企业很少投资，甚至会卖出长期资产，降低经营规模。所以C项是正确选项。"},{"k":1,"d":0,"t":1,"s":"企业销售商品收到的增值税销项税应在（）项目反映。","o":["收到的税费返还","收到其他与经营活动有关的现金","收回投资收到的现金","销售商品、提供劳务收到的现金"],"a":[3],"e":"该题考查经营活动现金流量项目的质量分析的理解。“销售商品、提供劳务收到的现金”项目反映企业本期销售商品、提供劳务收到的现金以及前期销售商品、提供劳务本期收到的现金（包括销售收入和应向购货方收取的增值税销项税）和本期预收的款项，减去本期销售退回的商品和前期销售本期退回的商品支付的现金。所以D项是正确选项。"},{"k":1,"d":0,"t":1,"s":"A公司为建造厂房于2007年7月1日从银行借入2000万元专门借款，借款期限为2年，年利率为6%，不考虑借款手续费。该项专门借款在银行的存款利率为年利率3%，2007年7月1日，A公司采取出包方式委托B公司为其建造该厂房，并预付了1000万元工程款，厂房实体建造工作于当日开始。该项厂房建造工程在2007年度应予资本化的利息金额为多少（）","o":["40","50","45","35"],"a":[2],"e":"该题考查长期股权投资的后续计量的理解。2007年度应予资本化的利息金额=2000×6%×6/12－1000×3%×6/12=45(万元）。所以C项是正确选项。"},{"k":1,"d":0,"t":1,"s":"（）是行业内所有企业某个相同财务指标的平均水平，或者是较优水平。","o":["行业基准","经验基准","历史基准","目标基准"],"a":[0],"e":"该题考查财务评价分析基准的理解。行业基准是行业内所有企业某人相同财务指标的平均水平，或者是较优水平。经验基准是依据大量的长期的日常观察和实践形成的基准。历史基准是本企业在过去某段时期内的实际值，根据需要可以选择历史平均值，也可以选择最佳值作为基准。目标基准是财务分析人员综合企业历史财务数据和现实经济状况提出的理想标准。所以A项是正确选项。"},{"k":1,"d":0,"t":1,"s":"对子公司投资，以及对被投资单位不具有共同控制或重大影响，且在活跃市场中没有报价、公允价值不能可靠计量的长期股权投资。这是长期股权投资的后续计量（）方法的适用范围。","o":["权益法","成本法","成本与可变现净值熟低法","收益法"],"a":[1],"e":"该题考查长期股权投资的后续计量的理解。成本法的适用范围:对子公司投资，以及对被投资单位不具有共同控制或重大影响，且在活跃市场中没有报价、公允价值不能可靠计量的长期股权投资。所以B项是正确选项。"},{"k":1,"d":0,"t":1,"s":"企业在资产负债表日，对某项劳务，如不能可靠地估计所提供劳务的交易结果，则对该项劳务正确的会计处理是（）","o":["不确认利润但能确认损失","既不确认利润也不确认损失","确认利润不确认损失","能确认利润也能确认损失"],"a":[0],"e":"该题考查企业营业收入确认的标准的理解。企业劳务收入的确认和计量在资产负债表日不能够对该项交易的结果进行可靠的估计，应该按照谨慎性原则进行处理，对已发生的成本和可能收回的金额进行尽可能合理的估计，只确认可能发生的损失，而不确认可能发生的收益。所以A项是正确选项。"},{"k":1,"d":0,"t":1,"s":"（）是财务分析中最重要的一部分。","o":["会计报表解读","盈利能力分析","营运能力分析","发展能力分析"],"a":[1],"e":"该题考查会计报表结构分析的盈利能力分析的理解。因为利润的大小直接关系企业所有相关利益人的利益，盈利能力分析是财务分析中最重要的一部分。所以B项是正确选项"},{"k":1,"d":0,"t":1,"s":"与企业现金流量无关的因素是（）","o":["经营周期","发展战略","市场环境","会计政策"],"a":[3],"e":"该题考查现金流量表质量分析的结果所影响的因素的理解。每种结果都与企业的经营周期、发展战略以及市场环境等因素有关。所以D项是正确选项。"},{"k":1,"d":0,"t":1,"s":"以下属于销售费用的是（）","o":["公司经费","工会经费","审计费","广告费"],"a":[3],"e":"该题考查对销售费用和管理费用的分类的理解。公司经费、工会经费和审计费属于管理费用。所以D项是正确选项。"},{"k":1,"d":0,"t":1,"s":"下列各项现金流出，不属于企业现金流量表中筹资活动产生的现金流量的有（）","o":["偿还短期借款","偿还应付账款","发放现金股利","支付借款利息"],"a":[1],"e":"该题考查对筹资活动内容的理解。偿付应付账款属于经营活动现金流出。所以B项是正确选项。"},{"k":1,"d":0,"t":1,"s":"下列项目中不属于现金流量表中“现金”的是（）","o":["银行存款","长期债券投资","银行汇票存款","银行本票存款"],"a":[1],"e":"该题考查现金的内容的理解。现金包括库存现金、银行存款、其他货币资金和现金等价物。所以B项是正确选项。"},{"k":1,"d":0,"t":1,"s":"目标基准一般是（）用于评价考核的。","o":["投资者","债权人","企业内部分析人员","政府"],"a":[2],"e":"该题考查目标基准涵义的理解。目标基准一般是企业内部分析人员用于评价考核的。所以C项是正确选项。"},{"k":1,"d":0,"t":1,"s":"（）是反映企业在某一会计期间的经营成果的财务报表。","o":["资产负债表","现金流量表","利润表","权益变动表"],"a":[2],"e":"该题考查对利润表的含义的理解。利润表是反映企业在某一会计期间的经营成果的财务报表。所以C项正确。"},{"k":1,"d":0,"t":1,"s":"同一企业不同时期发生的相同或者类似的交易或者事项，应当采用一致的会计政策，不得随意变更。体现了会计信息质量的（）要求。","o":["重要性","实质重要形式","谨慎性","可比性"],"a":[3],"e":"该题考查会计信息的质量特征的理解。可比性包括：（1)纵向可比，即同一企业不同时期发生的相同或者相似的交易或事项，应当采用一致的会计政策。(2)横向可比，即不同企业发生的相同或者相似的交易或事项，应当采用一致的会计政策。所以D项是正确选项。"},{"k":1,"d":0,"t":1,"s":"现金流量表的编制基础是（）","o":["现金","现金等价物","营运资金","库存现金"],"a":[0],"e":"该题考查现金流量表含义的理解。现金流量表是以现金为基础编制的，其中现金包括库存现金、银行存款、其他货币资金和现金等价物。所以A项是正确选项。"},{"k":1,"d":0,"t":1,"s":"下列业务中，涉及经营活动现金流量变化的项目为（）","o":["交纳所得税","以存货偿还债务","计提固定资产折旧","购买固定资产"],"a":[0],"e":"该题考查对经营活动项目的理解。以存货偿还债务和计提固定资产折旧并未涉及现金流量；购买固定资产涉及投资活动现金流量。所以A项是正确选项。"},{"k":1,"d":0,"t":1,"s":"收入是指 （）","o":["与所有者投入资本有关的经济利益流入","企业在日常经营活动中形成的流入","与向所有者分配利润无关的经济利益流入","会导致所有者权益减少的流出"],"a":[1],"e":"该题考查收入含义的理解。收入是指企业在日常经营活动中形成的流入所以B项是正确选项。"},{"k":1,"d":0,"t":1,"s":"以下不属于财务费用的是 （）","o":["计入固定资产的利息费用","不应计入固定资产的利息费用","金融机构的手续费","汇兑损失"],"a":[0],"e":"该题考查对财务费用内容的理解。不应计入固定资产的利息费用、金融机构的手续费和汇兑损失都属于财务费用。所以A项是正确选项。"},{"k":1,"d":0,"t":1,"s":"（）是财务分析最重要的依据和最主要的财务信息来源。","o":["财务报告","审计报告","市场信息","公司治理信息"],"a":[0],"e":"该题考查财务报告涵义的理解。财务报告是财务分析最重要的依据和最主要的财务信息来源。所以A项是正确选项。"},{"k":1,"d":0,"t":1,"s":"（）是企业在日常活动中持有以备出售的产成品或商品，处在生产过程中的在产品、在生产过程或提供劳务过程中耗用的材料和物料等。","o":["交易性金融资产","存货","应收账款","坏账"],"a":[1],"e":"该题考查对存货含义的理解。存货是企业在日常活动中持有以备出售的产成品或商品，处在生产过程中的在产品、在生产过程或提供劳务过程中耗用的材料和物料等。所以B项是正确选项。"},{"k":1,"d":0,"t":1,"s":"我国会计准则要求企业至少每（）对外报送一次财务报告。","o":["月","季度","半年","年"],"a":[3],"e":"该题考查财务报表报送时间的理解。我国会计准则要求企业至少每年对外报送一次财务报告所以D项是正确选项。"},{"k":1,"d":0,"t":1,"s":"财务分析人员综合企业历史财务数据和现实经济状况提出的理想标准称为（）","o":["经验基准","行业基准","历史基准","目标基准"],"a":[3],"e":"该题考查财务分析的评价基准种类的理解。财务分析的评价基准种类有：经验基准②行业基准③历史基准④目标基准，财务分析人员综合企业历史财务数据和现实经济状况提出的理想标准是D目标基准，所以D项是正确选项。"},{"k":1,"d":0,"t":1,"s":"甲公司和乙公司同为A集团的子公司，2007年6月1日，甲公司以银行存款取得乙公司所有者权益的80%，同日乙公司所有者权益的账面价值为1000万元。若甲公司支付银行存款720万元。则相关会计处理为：（）","o":["借：长期股权投资800贷：银行存款720资本公积一资本溢价80","借：长期股权投资1000贷：银行存款720资本公积一资本溢价280","借：长期股权投资800贷：银行存款720盈余公积一资本溢价80","借：长期债权投资800贷：银行存款720资本公积一资本溢价80"],"a":[0],"e":"该题考查长期股权投资的初始计量的理解。同一控制下的企业合并（一般发生在企业集团内部）：以被合并方所有者权益的账面价值为基础确认企业的长期股权投资，对于长期股权投资的账面价值与企业为取得投资而支付的补价之间的差额作为资本公积项目处理。所以A项是正确选项。"},{"k":1,"d":0,"t":1,"s":"将取得的财务报表数据与比较基准直接比较，分析人员可以观察到项目金额的变动情况和变动趋势，但绝对数变动难以反映不同规模分析对象之间的差异叫（）","o":["绝对数比较","百分比变动比较","定比比较","环比比较"],"a":[0],"e":"该题考查对比较分析法的总类的理解。按比较形式分类：绝对数比较和百分比变动比较。绝对数比较：将取得的财务报表数据与比较基准直接比较，分析人员可以观察到项目金额的变动情况和变动趋势，但绝对数变动难以反映不同规模分析对象之间的差异。所以A项是正确选项。"},{"k":1,"d":0,"t":1,"s":"（）是利润形成的主要来源。","o":["主营业务收入","其他业务收入","投资收益","营业外收入"],"a":[0],"e":"该题考查对营业收入的理解。企业营业收入是指企业在从事销售商品、提供劳务和让渡资产使用权等日常经营过程中取得的收入，分为主营业务收入和其他业务收入。其中主营业务收入是利润形成的主要来源。所以A项是正确选项。"},{"k":1,"d":0,"t":1,"s":"企业提供的会计信息应当与财务会计报告使用者的经济决策需要相关，有助于使用者评价过去和预测未来。这体现了（）的要求。","o":["重要性","实质重要形式","相关性","可比性"],"a":[2],"e":"该题考查会计信息的质量特征的理解。相关性：企业提供的会计信息应当与财务会计报告使用者的经济决策需要相关，有助于使用者评价过去和预测未来。所以C项是正确选项。"},{"k":1,"d":0,"t":1,"s":"现金流量表的编制基础是（）。","o":["永续盘存制","定期盘存制","权责发生制","收付实现制"],"a":[3],"e":"该题考查现金流量表的编制基础的理解。现金流量表的编制基础是收付实现制，利润表的编制基础是权责发生制。所以D项是正确选项。"},{"k":1,"d":0,"t":1,"s":"企业利润的来源中，未来可持续性最强的是（）","o":["主营业务利润","投资收益","营业外收支","资产价值变动损益"],"a":[0],"e":"该题考查利润表质量分析的两个方面的理解。从利润形成的过程看，只有企业利润主要来自于那些未来持续性较强的经济业务时，利润的质量才比较高。所以A项是正确选项。"},{"k":1,"d":0,"t":1,"s":"债权人是企业财务信息的需求主体，其最关心的是（）","o":["盈利能力","营运能力","偿债能力","发展能力"],"a":[2],"e":"该题考查财务信息需求主体的理解。债权人关注的是企业的未来还本付息的能力，所以债权人是企业财务信息的需求主体，其最关心的是企业的偿债能力。所以C项是正确选项。"},{"k":1,"d":0,"t":1,"s":"企业计算稀释每股收益时，应考虑的因素是（）","o":["绩效股","不可转换公司债券","可转换公司债券","股票股利"],"a":[2],"e":"该题考查对每股收益的理解。稀释每股收益是假设企业所有发行在外的稀释性普通股（如可转换债券、认股权证）均已转换为普通股，从而分别调整归属于普通股股东的当期净利润以及发行在外普通股的加权平均数计算而得的每股收益。所以C项是正确选项。"},{"k":1,"d":0,"t":1,"s":"对企业（）的评价是一个全方位、多角度评价过程。","o":["盈利能力","偿债能力","发展能力","营运能力"],"a":[2],"e":"该题考查会计报表结构分析的理解。企业发展的内涵是企业价值的增长，是企业通过自身的生产经营，不断扩大积累而形成的发展潜能。企业发展不仅仅是规模的扩大，更重要的是企业收益能力的上升，一般认为是净收益的增长。总之，对企业发展能力的评价是一个全方位、多角度评价过程。所以C项是正确选项。"},{"k":1,"d":0,"t":1,"s":"（）反映企业本期购买商品、接受劳务实际支付的现金包括增值税进项税额，以及本期支付前期购买商品、接受劳务的未付款项和本期预付款项，减去本期发生的购货退回收到的现金。","o":["销售商品、提供劳务收到的现金","支付给职工以及为职工支付的现金","支付的各项税费","购买商品、接受劳务支付的现金"],"a":[3],"e":"该题考查经营活动现金流量项目的质量分析的理解。购买商品、接受劳务支付的现金，本项目反映企业本期购买商品、接受劳务实际支付的现金包括增值税进项税额，以及本期支付前期购买商品、接受劳务的未付款项和本期预付款项，减去本期发生的购货退回收到的现金。所以D项是正确选项。"},{"k":1,"d":0,"t":1,"s":"财务分析的首要内容应当是（）","o":["会计报表解读","盈利及偿债能力分析","营运及发展能力分析","财务综合分析"],"a":[0],"e":"该题考查非会计信息的理解。会计报表解读是财务分析的首要内容。所以A项是正确选项。"},{"k":1,"d":0,"t":1,"s":"作为收入确认的一种方法，完工百分比法主要适用于（）","o":["商品销售收入的确认","提供劳务收入的确认","让渡资产使用权收入的确认","营业外收入的确认"],"a":[1],"e":"该题考查利润表结构中营业收入的理解。在资产负债表日能够对该交易的结果进行可靠的估计，应按照完工百分比法确认提供劳务收入。所以B项是正确选项。"},{"k":1,"d":0,"t":1,"s":"企业内部研究开发项目研究阶段的支出应当在发生时计入（）","o":["营业费用","项目成本","在建工程","当期损益"],"a":[3],"e":"该题考查对当期损益的理解。企业内部研究开发项目研究阶段的支出应当在发生时计入当期损益。所以D项是正确选项。"},{"k":1,"d":0,"t":1,"s":"，下列不属于会计信息质量要求的有（）","o":["可理解性","相关性","权责发生制","谨慎性"],"a":[2],"e":"该题考查会计信息的质量特征的理解。最常用的会计信息的质量特征包括：可靠性、相关性、可理解性、可比性、实质重于形式、重要性、谨慎性和及时性，权责发生制是会计的记账基础。所以C项是正确选项。"},{"k":1,"d":0,"t":1,"s":"在信用分析目的下进行财务分析的内容是（）","o":["选择未来具有优良业绩和成长性的投资对象，回避投资风险","分析企业的偿债能力，保证在未来安全收回本金和利息","企业的生产能力、生产结构分析","内部投资项目分析"],"a":[1],"e":"该题考查对财务分析目的的理解。信用分析目的下，分析人员主要分析企业的偿债能力，保证在未来安全收回本金和利息。所以B项是正确选项。"},{"k":1,"d":0,"t":1,"s":"关于利润表质量分析下列表述错误的是（）","o":["没有现金支撑的利润质量较差","利润表质量分析就是对利润形成过程的质量进行分析","某工业企业利润主要来自于投资收益，说明该企业利润质量较差","某商业企业利润主要来自于营业收入，说明该企业利润质量较高"],"a":[1],"e":"该题考查利润表质量分析的理解。利润表质量分析就是对利润形成过程和利润结果的质量进行分析，B错误。从利润结果来看，因为采用权责发生制的关系，企业利润与现金流量不同步，而没有现金撑的利润质量较差。A正确。从利润形成过程来看，只有企业利润主要来自未来可持续性较强的经济业务时，利润质量才较高，工业企业、商业企业等，其营业收入可持续性较强，而投资收益可持续性差，所以C、D均正确。"},{"k":1,"d":0,"t":1,"s":"财务分析的目的是（）","o":["企业相关利益主体以企业财务报告及其他经济资料为依据，结合一定的标准，运用科学的方法，对企业的财务状况进行分析。","通过对财务报告以及其他企业相关信息进行综合分析，得出简洁明了的分析结论，从而帮助企业相关得益人进行决策和评价。","企业相关利益主体以企业财务报告及其他经济资料为依据，结合一定的标准，运用科学的方法，对企业的现金流量进行分析。","企业相关利益主体以企业财务报告及其他经济资料为依据，结合一定的标准，运用科学的方法，对企业的经营成果进行分析。"],"a":[1],"e":"该题考查财务分析的目的的理解。财务分析的目的是通过对财务报告以及其他相关信息进行综合分析，得出简洁明了的分析结论，从而帮助企业相关利益人进行决策和评价。具体目的分为：①为投资决策、信贷决策、销售决策和宏观经济决策等提供依据。②为企业内部经营管理业绩评价、监督和选择经营管理者提供依据。所以B项是正确选项。财务分析是企业相关利益主体以企业财务报告及其他经济资料为依据，结合一定的标准，运用科学的方法，对企业的财务状况、经营成果、现金流量进行全面的分析，为相关决策提供信息支持。所以ACD项不正确。"},{"k":1,"d":0,"t":1,"s":"对于一个健康的、正在成长的公司来说，经营活动现金净流量一般应（）零。","o":["大于","小于","等于","不等于"],"a":[0],"e":"该题考查对现金流量表人项目的综合理解。对于一人健康的、正在成长的公司来说，经营活动现金净流量一般应大于零，投资活动现金净流量应小于零，筹资活动的现金净流量应正负相间。所以A项是正确选项。"},{"k":1,"d":0,"t":1,"s":"股东和潜在投资者通过财务分析主要关注（）","o":["发展能力","偿债能力","营运能力","未来的盈利能力"],"a":[3],"e":"该题考查会计报表结构分析的盈利能力分析的理解。股东和潜在投资者通过财务分析主要关注企业的盈利能力。所以D项是正确选项。"},{"k":1,"d":0,"t":2,"s":"下列各项中，应计入营业外支出的有（）","o":["处置固定资产的净损失","向希望工程捐赠设备","各种税收上的滞纳金","出售材料的净损失","非货币资产交换损失"],"a":[0,1,2,4],"e":"该题考查营业外支出概念的理解。出售材料作为其他业务核算。所以ABCE项是正确选项。"},{"k":1,"d":0,"t":2,"s":"由于财务信息的需求主体不同，财务分析的目的可以分为（）","o":["投资分析目的","信用分析目的","经营决策分析目的","盈利分析目的","发展分析目的"],"a":[0,1,2],"e":"该题考查财务分析的目的的理解。由于财务信息的需求主体不同，财务分析的目的可以分为投资分析目的、信用分析目的和经营决策分析目的。所以ABC项是正确选项。"},{"k":1,"d":0,"t":2,"s":"在营业收入分析时，一般来说，可以质疑营业收入质量不高的情形有（）","o":["企业的营业收入主要来自于关联方的交易","行政手段造成的收入占企业收入的比重较大","企业研发的更适合市场需要的产品收入占全部营业收入的比重较大","企业对尚未占领的区域具有相应的推进计划并已经着手实施","企业产品的配置适应不同区域消费者的偏好"],"a":[0,1],"e":"该题考查营业收入的构成的理解。营业收入构成的分析包括：品种构成、区域构成、营业收入中来自关联方的比重以及行政手段造成的收入占企业收入的比重。企业的营业收入来自于关联方的交易，很可能是不公允，所以如果这部分收入占较大比重，说明收入质量不高，A选；行政手段增加的收入与企业自身的竞争力无关，质量不高，B选；适合市场需要的产品收入比重较大，说明收入质量高，C不选；企业对尚未占领的区域具有相应的推进计划，通常可以认为收入可持续性较强，质量较高，D不选；产品配置适应消费者的偏好，说明收入质量高。所以AB项是正确选项。"},{"k":1,"d":0,"t":2,"s":"企业保持一定的货币资金的动机有（）","o":["交易动机","预防动机","投资动机","保守动机","盈利动机"],"a":[0,1,2],"e":"该题考查货币资金动机的理解。企业保持一定的货币资金的动机有交易动机、预防动机和投资动机。所以ABC项是正确选项。"},{"k":1,"d":0,"t":2,"s":"财务分析评价基准种类有（）","o":["经验基准","科学基准","行业基准","历史基准","目标基准"],"a":[0,2,3,4],"e":"该题考查财务分析评价基准种类的理解。财务分析评价基准种类有经验基准、行业基准、历史基准和目标基准。所以ACDE项是正确选项。"},{"k":1,"d":0,"t":2,"s":"对会计报表的解读一般分为（）","o":["会计报表质量分析","会计报表趋势分析","会计报表结构分析","会计报表主体分析","会计报表方法分析"],"a":[0,1,2],"e":"该题考查会计报表的解读的理解。对会计报表的解读一般分为：会计报表质量分析、会计报表趋势分析和会计报表结构分析。所以ABC项是正确选项。"},{"k":1,"d":0,"t":2,"s":"下列各项中，应计入营业外收入的是（）","o":["原材料盘盈","无法查明原因的现金溢余","接受捐赠","转让无形资产所有权取得的净收益","非货币资产交换收益"],"a":[1,2,3],"e":"该题考查营业外收入的理解。原材料盘盈经过批准后冲减管理费用，无法查明的现金溢余经批准后计入营业外收入，接受捐赠属于捐赠利得，计入营业外收入，转让无形资产所有权取得的净收益应计入营业外收入。所以BCD项是正确选项。"},{"k":1,"d":0,"t":2,"s":"财务分析中非会计信息主要包括（）","o":["资产负债表","宏观经济信息","审计报告","现金流量表","公司治理信息"],"a":[1,2,4],"e":"该题考查财务分析非会计信息的理解。财务分析中非会计信息主要包括审计报告、市场信息、公司治理信息和宏观经济信息。所以BCE项是正确选项。"},{"k":1,"d":0,"t":2,"s":"财务信息需求主体包括（）","o":["股东","债权人","企业内部管理者","政府","企业供应商"],"a":[0,1,2,3,4],"e":"该题考查财务信息需求主体的理解。财务信息需求主体包括：股东及潜在投资者、债权人、企业内部管理者、政府和企业供应商。所以ABCDE项是正确选项。"},{"k":1,"d":0,"t":2,"s":"下列关于利润表质量分析表述正确的有（）","o":["如果企业的利润总额绝大部分来源于营业收入，则企业的利润质量较高","来自于与关联方交易的营业收入，分析人员应当单列，或者对其按照公允价值进行调整","行政手段增加的收入与企业自身竞争力无关，质量不高，应当在财务分析中予以剔除","营业外收支项目没有可持续性，所以在分析利润状况时应当从利润总额中扣除","企业本期投资收益金额较大，说明本期利润质量较高"],"a":[0,1,2,3],"e":"该题考查利润表的质量分析的理解。企业投资收益不具有持续性，即使当期企业获得了金额较大的投资收益，也不能对其评价过高。所以ABCD项是正确选项。"},{"k":1,"d":0,"t":2,"s":"按照我国《企业会计准则基本准则》的要求，会计信息的质量特征包括（）","o":["可靠性","相关性","可理解性","可比性","实质重于形式"],"a":[0,1,2,3,4],"e":"该题考查会计信息的质量特征的理解。常见的会计信息的质量特征包括以下几方面：可靠性、相关性、可理解性、可比性、实质重于形式。所以ABCDE项是正确选项。"},{"k":1,"d":0,"t":2,"s":"对应收账款质量的判断应当从以下方面分析（）","o":["应收账款的数量","应收账款的账龄","应收账款的债务人分布","坏账准备的计提","真实性"],"a":[1,2,3],"e":"该题考查应收账款质量的判断的理解。对应收账款质量的判断应当应收账款的账龄、债务人分布和坏账准备的计提方面分析。所以BCD项是正确选项。"},{"k":1,"d":0,"t":2,"s":"下列关于现金流量表的表述正确的有（）","o":["现金流量表是反映企业一定会计期间现金和现金等价物流入和流出的报表","现金流量表将企业一定期间产生的现金流量分为经营活动现金流量、投资活动现金流量和筹资活动现金流量","现金流量表中的现金包括现金、银行存款和其他货币资金","间接法便于分析企业经营活动产生的现金流量的来源和用途，预测企业现金流量的未来前景。","直接法便于了解净利润与经营活动产生的现金流量差异的原因，从现金流量的角度分析净利润的质量。"],"a":[0,1],"e":"该题现金流量表知识的理解。现金流量表中的现金包括现金、银行存款、其他货币资金和现金等价物，C错误。直接法便于分析企业经营活动产生的现金流量的来源和用途，预测企业现金流量的未来前景。所以D错误。间接法便于了解净利润与经营活动产生的现金流量差异的原因,从现金流量的角度分析净利润的质量。所以E错误所以AB项是正确选项"},{"k":1,"d":0,"t":2,"s":"下列情形中，不应当确认收入的是（）","o":["企业预收某商品的货款，但该商品尚未发出","销售商品采用托收承付方式，已经办妥托收手续","售出的商品中附有退货条款，但无法确定其退货的可能性","企业提供的一项劳务，在资产负债表日不能对交易结果进行可靠的估计，已发生的成本预计无法收回","旅行社向客户收取的代购门票收入"],"a":[0,2,3,4],"e":"该题考查确认销售收入实现的时点的理解。企业采用预收货款方式销售商品，应在发出商品时确认收入，而预收货款未发出商品时应确认负债，所以A不应当确认收入。销售商品采用托收承付方式，应在办妥托收手续时确认收入，由于B中已经办妥托收手续所以可以确认收入。售出的商品中附有退货条款，但无法确定其退货的可能性，说明商品所有权上的风险尚未转移，应在退货期满时确认收入，所以C不应当确认收入。提供的劳务收入，在资产负债表日不能对交易结果进行可靠的估计，对于已经发生的成本确认为费用，不确认可能发生的收益。D不确认收入。旅行社向客户收取的代购门票收入，是代收款项，并不能确认收入。E不确认收入。所以ACDE项是正确选项。"},{"k":1,"d":0,"t":2,"s":"关于财务分析的目的表述正确的有（）","o":["帮助企业相关利益人进行决策和评价","为投资决策、宏观经济政策等提供依据。","为信贷决策、销售决策提供依据。","为企业内部经营管理业绩评价、监督和选择经营管理者提供依据。","了解财务信息的供求关系，获得高质量的财务信息。"],"a":[0,1,2,3],"e":"该题考查财务分析含义和目的的理解。1、财务分析的含义财务分析是企业相关利益主体以企业财务报告及其他经济资料为依据，结合一定的标准，运用科学的方法，对企业的财务状况、经营成果、现金流量进行全面的分析，为相关决策提供信息支持。2、财务分析的目的财务分析的目的是通过对财务报告以及其他相关信息进行综合分析，得出简洁明了的分析结论，从而帮助企业相关利益人进行决策和评价。具体目的分为：①为投资决策、信贷决策、销售决策和宏观经济决策等提供依据。②为企业内部经营管理业绩评价、监督和选择经营管理者提供依据。所以ABCD项是正确选项。"},{"k":1,"d":0,"t":2,"s":"财务分析的内容主要包括（）","o":["会计报表解读","盈利能力分析","营运能力分析","发展能力分析","财务综合分析"],"a":[0,1,2,3,4],"e":"该题考查财务分析内容的理解。财务分析的内容主要包括会计报表解读、盈利能力分析、偿债能力分析、营运能力分析、发展能力分析和财务综合分析。所以ABCDE项是正确选项。"},{"k":1,"d":0,"t":2,"s":"下列属于内部非公开信息的有（）","o":["财务报告","财务预算","市场信息","企业成本构成","审计报告"],"a":[1,3],"e":"该题考查财务分析内容的理解。常见的非会计信息包括以下几方面：①审计报告②市场信息③公司治理信息④宏观经济信息。所以BD项是正确选项。"},{"k":1,"d":0,"t":2,"s":"投资活动现金净流量小于零可能的结果有（）","o":["投资收益显著","投资收益状况较差","出现财务危机不得不处置长期资产以补偿日常活动现金需求","企业当期有较大的对外投资，对企业长远发展有利","企业本期投资缩小"],"a":[1,3],"e":"该题考查货币资金动机的理解。投资活动现金净流量小于零的解释：（1）企业投资收益状况较差，投资没取得经济效益，并导致现金净流出(2）企业当期有较大的对外投资，因为大额投资一般会形成长期资产，并影响企业今后的生产经营能力，所以这种状况下对企业的长远发展有利。所以BD项是正确选项。"},{"k":1,"d":0,"t":2,"s":"下列各项费用应计入管理费用的有（）","o":["房产税","消费税","土地使用税","印花税","车船使用税"],"a":[0,2,3,4],"e":"该题考查计入管理费用各种税的理解。消费税属于营业税费，应计入“营业税金及附加”。所以ACDE项是正确选项。"},{"k":1,"d":0,"t":2,"s":"审计报告中的审计意见有（）","o":["无保留意见","保留意见","否定意见","无法表示意见","部分保留意见"],"a":[0,1,2,3],"e":"该题考查审计报告的理解。审计报告中的审计意见有无保留意见、保留意见、否定意见和无法表示意见。所以ABCD项是正确选项。"},{"k":1,"d":0,"t":2,"s":"下列事项中属于投资活动产生的现金流量的有（）","o":["取得投资收益收到的现金","出售固定资产所收到的现金","取得短期投资所支付的现金","分配股利所支付的现金","取得子公司及其他营业单位支付的现金净额"],"a":[0,1,2,4],"e":"该题考查投资活动内容的理解。分配股利所支付的现金属于筹资活动的。所以ABCE项是正确选项。"},{"k":1,"d":0,"t":2,"s":"手我国的现金流量表将现金流量分为以下几类（）","o":["经营活动","投资活动","筹资活动","纳税活动","分配活动"],"a":[0,1,2],"e":"该题考查现金流量表的内容的理解。现金流量表将企业一定期间产生的现金流量分为三类：经营活动现金流量；投资活动现金流量和筹资活动现金流量。所以ABC项是正确选项。"},{"k":1,"d":0,"t":2,"s":"对营业成本进行质量分析时，需要注意（）","o":["关注企业存货发出的方法及其变动","区域构成","检查企业营业收入与营业成本之间的匹配关系","企业是否存在操纵营业成本的行为","产品的品种"],"a":[0,2,3],"e":"该题考查营业成本的理解。对营业成本进行质量分析时，需要注意关注企业存货发出的方法及其变动；检查企业营业收入与营业成本之间的匹配关系，企业是否存在操纵营业成本的行为。所以ACD项是正确选项。"},{"k":1,"d":0,"t":2,"s":"财务分析的目的具体可以分为（）","o":["为投资决策、信贷决策、销售决策和宏观经济提供依据","提高企业盈利能力","为企业内部经营管理业绩评价、监督和选择经营管理者提供依据","扩大融资规模","转变企业经营模式"],"a":[0,2],"e":"该题考查财务分析的目的的理解。财务分析的目的具体可以分为投资决策、信贷决策、销售决策和宏观经济提供依据和为企业内部经营管理业绩评价、监督和选择经营管理者提供依据。所以AC项是正确选项。"},{"k":1,"d":0,"t":2,"s":"市场信息包括资本市场信息、产品市场信息，其中资本市场信息主要涉及（）","o":["销售量","企业产品的市场占有率","交易价格","交易量","销售价格"],"a":[2,3],"e":"该题考查市场信息中资本市场信息的理解。市场信息中资本市场信息主要涉及交易价格和交易量，产品市场信息包括销售量、销售价格、企业产品的市场占有率。所以CD项是正确选项。"},{"k":1,"d":0,"t":2,"s":"对不同时期财务指标的比较，可以计算成动态比率指标，包括（）","o":["定比动态比率","历史比率","环比动态比率","构成比率","基期动态比率"],"a":[0,2],"e":"该题考查动态比率指标的理解。动态比率指标包括定比动态比率和环比动态比率。所以AC项是正确选项。"},{"k":1,"d":0,"t":2,"s":"股份支付是企业为获取职工和其他方提供服务而授予权益工具或承担以权益工具为基础确定的负债的交易，分为（）","o":["权益结算的股份支付","银行存款结算的股份支付","工资结算的股份支付","票据结算的股份支付","现金结算的股份支付"],"a":[0,4],"e":"该题考查股份支付的分类的理解。股份支付分为权益结算的股份支付和现金结算的股份支付。所以AE项是正确选项。"},{"k":1,"d":0,"t":2,"s":"下列经营活动现金流量的项目，财务分析人员应重点关注的是（）","o":["销售商品、提供劳务收到的现金","收到其他与经营活动有关的现金","购买商品、接受劳务支付的现金","支付的其他与经营活动有关的现金","吸收投资收到的现金"],"a":[0,2],"e":"该题考查经营活动现金流量的理解。首先排除E，因为E选项不属于经营活动现金流量项目，经营活动现金流量中销售商品、提供劳务收到的现金和购买商品、接受劳务支付的现金具有可持续性，应重点关注，而BD项目具有偶然性，不应重点关注。所以AC项是正确选项。"},{"k":1,"d":0,"t":2,"s":"销售商品收入同时满足以下条件时才能加以确认（）","o":["企业已将商品所有权上的主要风险和报酬转移给购货方","企业既没有保留通常与所有权相联系的继续管理权，也没有对售出的商品实施有效控制","收入的金额能够可靠地计量","相关的经济利益很可能流入企业","相关的已发生或将发生的成本能够可靠地计量"],"a":[0,1,2,3,4],"e":"该题考查销售商品收入确认的条件的理解。销售商品收入同时满足以下条件时才能加以确认：①企业已将商品所有权上的主要风险和报酬转移给购货方；②企业既没有保留通常与所有权相联系的继续管理权，也没有对售出的商品实施有效控制；③收入的金额能够可靠地计量；④相关的经济利益很可能流入企业；③相关的已发生或将发生的成本能够可靠地计量。所以ABCDE项是正确选项。"},{"k":1,"d":0,"t":2,"s":"在现金流量表附注中将净利润调整为经营活动的现金流量时，需要调整的项目有（）","o":["资产减值准备","主营业务收入","固定资产折旧","财务费用","管理费用"],"a":[0,2,3],"e":"该题考查现金流量表补充资料涉及的项目的理解。企业采用间接法在现金流量表披露将净利润调节为经营活动现金流量的信息。具体方法是以净利润为起点，加减以下项目后得到企业经营活动现金净流量（1）资产减值准备（2）固定资产折旧等（3）无形资产摊销、长期待摊费用摊销（4）待摊费用减少（5）预提费用增加项目（6）处置固定资产、无形资产和其他长期资产的损失（7）公允价值变动损失（8）财务费用（）（）（）（）（）（)目的增加所以ACD项是正确选项。"},{"k":2,"d":0,"t":1,"s":"某股份有限公司资产负债率当年为40%，平均资产总额为2000万元，利润总额为300万元，所得税为88万元，则该企业当年的净资产收益率为（）","o":["13.4%","17.67%","17.75%","22%"],"a":[1],"e":"该题考查净资产收益率的计算。净收益=利润总额－所得税=300-88=212万元，平均净资产=平均资产总额×(1-资产负债率)=2000×(1-40%)=1200万元，净资产收益率=212/1200×100%=17.67%。所以B项是正确选项。"},{"k":2,"d":0,"t":1,"s":"速动资产不包括（）","o":["应收账款","存货","货币资金","短期投资"],"a":[1],"e":"扣除这些是因为这些资产变现能力相对于其他流动资产来说要更差一些。所以B项是正确选项。"},{"k":2,"d":0,"t":1,"s":"某企业销售净利率为5%，销售毛利率为8%，流动资产周转率为8次，总资产周转率为3次，则该企业流动资产收益率为（）","o":["15%","24%","30%","40%"],"a":[3],"e":"该题考查流动资产收益率公式的理解。解析：流动资产收益率=销售净利率×流动资产周转率=5%×8=40%。所以D项是正确选项。"},{"k":2,"d":0,"t":1,"s":"在企业各利益主体中，最关心企业流动性和短期偿债能力的是（）","o":["长期债权人","短期债权人","经营者","股东"],"a":[1],"e":"该题考查谁最关心企业流动性和短期偿债能力的理解。对企业的短期债权人而言，企业短期偿债能力，直接威胁到其利息与本金安全性。所以，短期债权人对企业的流动性和短期偿债能力的关注一定是最高的。所以B项是正确选项。"},{"k":2,"d":0,"t":1,"s":"（）是指企业资产负债表上以各种形式存在的资产总额，包括了股权人和债权人投资的全部金额。","o":["全部资金","权益资金","长期资金","总资产"],"a":[0],"e":"全部资金是指企业资产负债表上以各种形式存在的资产总额，包括了股权人和债权人投资的全部金额。所以A项是正确选项。"},{"k":2,"d":0,"t":1,"s":"下列不构成企业营业收入的业务是","o":["销售服装产生的收入","提供网络服务带来的收入","出租闲置固定资产产生的收入","收到的政府补助收入"],"a":[3],"e":""},{"k":2,"d":0,"t":1,"s":"负债是企业所承担的现有义务，履行该义务预期会导致（）","o":["经济利益流出企业","企业利润的增加","企业费用的降低","企业收入的减少"],"a":[0],"e":"该题考查对负债含义的理解。负债是企业过去的交易或者事项形成的，预期会导致经济利益流出企业的现时义务。所以A项是正确选项。"},{"k":2,"d":0,"t":1,"s":"甲公司2007年实现的归属于普通股股东的净利润为6800万元。该公司2007年1月1日发行在外的普通股为10000万股，6月30日定向增发1200万股普通股，9月30日自公开市场回购240万股拟用于高层管理人员股权激励，该公司2007年基本每股收益为（）元。","o":["0.60","0.61","0.65","0.56"],"a":[2],"e":"该题考查基本每股收益的计算。2007年基本每股收益=6800/(10000+1200×6/12-240×3/12)=0.65(元)。所以C项是正确选项。"},{"k":2,"d":0,"t":1,"s":"（）是对企业的各个方面进行系统、全面的分析，从而对企业的财务状况和经营成果做出整体的评价与判断。","o":["综合分析","审计","监督","评估"],"a":[0],"e":"该题考查综合分析的含义。综合分析是对企业的各个方面进行系统、全面的分析，从而对企业的财务状况和经营成果做出整体的评价与判断。所以A项是正确选项。"},{"k":2,"d":0,"t":1,"s":"（）的审计报告可读性最差，很难用来帮助报表使用者分析企业的财务状况、经营成果和现金流量。","o":["无保留意见","带强调事项段的无保留意见","无法表示意见","否定意见"],"a":[2],"e":"该题考查无法表示意见的审计报告的理解。无法表示意见的审计报告可读性最差，很难用来帮助报表使用者分析企业的财务状况、经营成果和现金流量。所以C项是正确选项。"},{"k":2,"d":0,"t":1,"s":"某公司年未会计报表上部分数据为：流动负债60万元，流动比率为2，速动比率为1.2，销售成本100万元，年初存货为56万元，则本年度存货周转次数为（）","o":["1.65次","2次","2.3次","1.45次"],"a":[1],"e":"该题考查存货周转次数计算。本题的主要考核点是存货周转次数的计算。由于：流动比率=流动资产/流动负债，因此：2=流动资产/60，可求得期末流动资产为120(万元)，又由于速动比率=(流动资产-存货)/流动负债，因此:1.2=(120-存货)/60，可求得期末存货为48(万元)，则:年未存货周转次数=100/[(48+56)-2)]=2(次)。所以B项是正确选项。"},{"k":2,"d":0,"t":1,"s":"权益乘数与下列哪项指标互为倒数（）","o":["资产负债率","股权比率","产权比率","有形净值债务率"],"a":[1],"e":"该题考查权益乘数公式的理解。权益乘数=1-股权比率。所以B项是正确选项。"},{"k":2,"d":0,"t":1,"s":"营运资本指的是（）","o":["流动负债","流动资产减去存货后的余额","流动资产减去流动负债后的余额","生产经营用的货币资金"],"a":[2],"e":"该题考查营运资本含义的理解。是指流动资产总额减流动负债总额后的剩余部分，也称为净营运资本，意味着企业的流动资产在偿还全部流动负债后还有多少剩余。实际上是反映流动资产可用于归还和抵补流动负债后的余额，营运资本越多，说明企业可用于偿还流动负债的资金越充足，企业的短期偿债能力越强，债权人收回债权的安全性越高。所以C项是正确选项。"},{"k":2,"d":0,"t":1,"s":"如果流动负债小于流动资产，则期末以现金偿付一笔短期借款所导致的结果是（）","o":["营运资金减少","营运资金增加","流动比率降低","流动比率提高"],"a":[3],"e":"该题考查流动比率的理解。营运资金=流动资产－流动负债，以现金偿还短期借款，导致流动资产和流动负债同时减少相等金额，营运资金应该不变，而流动比率应该提高。所以D项是正确选项。"},{"k":2,"d":0,"t":1,"s":"乙公司2007年1月1日发行利息率为8%，每张面值100元的可转换债券20万张，规定每张债券可转换为1元面值普通股80股。2007年净利润8000万元，2006年发行在外普通股4000万股，公司适用的所得税率为33%，则2007年的稀释每股收益为（）","o":["2","1.44","1.56","1.48"],"a":[1],"e":"该题考查稀释的每股收益的计算。稀释的每股收益：税后利息费用=100×10×8%×(1-33%)=53.6(万元)，增加的普通股股数=20×80=1600(万股)，稀释的每股收益=(8000+53.6)/(4000+1600)=1.44(元/股)。所以B项是正确选项。"},{"k":2,"d":0,"t":1,"s":"（）又称为股东权益收益率，是企业的净利润与其平均净资产之间的比值。","o":["净资产收益率","总资产收益率","资产收益率","每股收益"],"a":[0],"e":"项。"},{"k":2,"d":0,"t":1,"s":"企业发展能力可从企业发展的动因和结果两个大的层面分析，其中发展动因层面主要是指（）","o":["对企业的竞争能力进行分析","对企业财务状况进行分析","对企业资产流动性进行分析","对企业营运能力进行分析"],"a":[0],"e":"该题考查企业发展能力的分析。从企业发展的动因与结果两个大的层面分析企业发展能力，其中发展动因层面主要是对企业的竞争能力进行分析，结果层面主要是对财务状况进行分析。所以A项是正确选项。"},{"k":2,"d":0,"t":1,"s":"某企业2007年流动资产周转率为8次，2007年流动资产平均余额为5000万元，固定资产平均余额为6000万元，假设不存在其他的资产，则总资产周转天数为（）","o":["75天","45天","60天","100天"],"a":[3],"e":"该题考查总资产周转天数的计算。2007年平均总资产=5000+6000=11000万元，流动资产占总资产比重=5000-11000=45%，总资产周转率=8×45%=3.6次，总资产周转天数=360-3.6=100天。所以D项是正确选项。"},{"k":2,"d":0,"t":1,"s":"企业管理当局进行营运能力的分析的目的是（）","o":["达到最优化资产结构的目的","获取更多的收益，实行资本保值","保障债务的偿付","扩大规模"],"a":[0],"e":"该题考查对营运能力的分析目的的理解。企业管理当局的分析目的：一是通过对资产结构的分析发现企业结构问题，寻找优化资产结构的途径与方法，制定优化资产结构的决策，进而达到优化资产结构的目的；二是发现企业资产周转过程中的问题，寻找加速资金周转的途径与方法，制定加速资金周转的决策，进而达到优化资源配置、加速资金周转的目的。所以A项是正确选项。"},{"k":2,"d":0,"t":1,"s":"在计算速动比率时，要从流动资产中扣除存货部分，再除以流动负债，这样做的原因在于流动资产中存货（）","o":["价值变动最大","质量难以保证","数量不宜确定","变现能力最低"],"a":[0],"e":"该题考查对速动资产的含义的理解。所谓速动资产是指流动资产减去变现能力较差且不稳定的预付账款、存货、其他流动资产等项目后的余额。所以A项正确。"},{"k":2,"d":0,"t":1,"s":"最为谨慎的长期偿债能力比率为（）","o":["资产负债率","所有者权益比率","权益乘数","有形净值债务比率"],"a":[3],"e":"该题考查长期偿债能力比率的理解。有形净值债务比率和有形资产债务比率是评价企业长期偿债能力的更加谨慎、稳健的财务比率。所以D项是正确选项。"},{"k":2,"d":0,"t":1,"s":"流动比率小于1时，赊购原材料若干，将会（）","o":["增大流动比率","降低流动比率","降低资金","增大营运资金"],"a":[0],"e":"该题考查流动比率的分析的理解。赊购原材料若干，使流动资产增加同时流动负债增加，当流动比率小于1时，分子分母增加同样金额时，会增大流动比率。所以A均正确。"},{"k":2,"d":0,"t":1,"s":"某企业年初应收款项为3800万元，年末应收款项为4100万元，全年销售收入净额为58540万元，已知其赊销收入额占其销售收入的80%，则该公司应收账款的周转天数为（）","o":["30天","4天","23天","25天"],"a":[0],"e":"该题考查应收账款的周转天数的计算。赊销收入净额=58540×80%=46832(万元)，应收账款平均余额=(3800+4100)-2=3950(万元)，应收账款周转天数=3950*360/46832=29.99~30(天)。所以A项是正确选项。"},{"k":2,"d":0,"t":1,"s":"现有资产通过清算所能获得的现金对负债的保障程度称为（）","o":["偿债能力","静态偿债能力","动态偿债能力","非正常状态下的偿债能力"],"a":[1],"e":"该题考查静态偿债能力含义的理解。注意单选题要选择一个最符合题意的项目，静态偿债能力是指现有资产通过清算所能获得的现金对负债的保障程度,所以B项是正确选项。"},{"k":2,"d":0,"t":1,"s":"下列指标中，主要用来说明企业盈利能力的是（）","o":["权益乘数","每股账面价值","每股收益","产权比率"],"a":[2],"e":"该题考查与股本有关的盈利能力分析指标的理解。每股收益是属于与股本有关的盈利能力分析指标。所以C项是正确选项。"},{"k":2,"d":0,"t":1,"s":"某企业上年度和本年度的流动资产平均占用均为100万元，流动资产周转率分别为6次和8次，则本年度比上年度的销售收入增加了（）","o":["180万元","300万元","200万元","80万元"],"a":[2],"e":"该题考查对流动资产周转率的理解。流动资产周转率(次数)=主营业务收入-流动资产平均余额，上年主营业务收入=6*100=600万元，本年主营业务收入=8×100=800万元，增加了200万。所以C项是正确选项。"},{"k":2,"d":0,"t":1,"s":"某企业销售净利率为5%，销售毛利率为8%，流动资产周转率为9次，总资产周转率为6次，不包括其他资产，则该企业固定资产收益率为（）","o":["60%","24%","30%","90%"],"a":[3],"e":"入=360-6=60天总资产周转天数－流动资产周转天数=360×总资产平均额/销售收入－360×流动资产平均额/销售收入=360×(总资产平均余额－流动资产平均余额)/销售收入=360×固定资产平均余额/销售收入=60-40=20天即：固定资产周转率=360-20=18次固定资产收益率=销售净利率×固定资产周转率=5%×18=90%所以D项是正确选项"},{"k":2,"d":0,"t":1,"s":"（）是指从外购商品或接受劳务从而承担付款义务开始，到收回因销售商品或提供劳务并收取现金之间的时间间隔。","o":["现金周期","营业周期","销售周期","利润周期"],"a":[1],"e":"该题考查对营业周期概念的理解。营业周期是指从外购商品或接受劳务从而承担付款义务开始，到收回因销售商品或提供劳务并收取现金之间的时间间隔。所以B项是正确选项。"},{"k":2,"d":0,"t":1,"s":"产品有无竞争能力的首要条件是（）","o":["产品品种","产品价格","质量的优劣","产品售后服务"],"a":[2],"e":"该题考查企业竞争策略分析。产品质量的优劣是产品有无竞争能力的首要条件。提高产品质量是提高企业竞争能力的主要手段。所以C项是正确选项。"},{"k":2,"d":0,"t":1,"s":"下列关于普通股每股收益的叙述错误的是（）","o":["分子为普通股股东享有的当期净利润","分母为发行在外的普通股的加权平均数","数值越高，表明企业的盈利能力越大","在理论上提供了每股股票的最高价格"],"a":[3],"e":"该题考查每股收益的理解。普通股每股收益只对股票价格产生较大影响。所以D项是正确选项。"},{"k":2,"d":0,"t":1,"s":"在计算普通股每股股利时，普通股股利总额可以只采用（）","o":["股票股利","财产股利","清算股利","现金股利"],"a":[3],"e":"该题考查对每股股利的理解。每股股利=现金股利总额-发行在外的普通股股数。所以D项是正确选项。"},{"k":2,"d":0,"t":1,"s":"下列各项中，能作为短期偿债能力辅助指标的是（）","o":["应收账款周转率","存货周转率","营运资本周转率","流动资产周转率"],"a":[2],"e":"该题考查营运资本的理解。营运资本指标多少为宜并没有固定的标准，对短期债权人来说，希望营运资本越高越好；对企业来说，过多持有营运资本虽然可以提高短期偿债能力，降低财务风险，但有可能降低企业的盈利能力(流动资产与长期资产相比流动性强，但获利能力差)，所以需要在风险和收益之间进行权衡，采取不同融资策略，合理安排企业营运资本数额。所以C项是正确选项。"},{"k":2,"d":0,"t":1,"s":"如果注册会计师经过审计后，认为被审计单位会计报表符合以下（）条件时，应该出具无保留意见的审计报告。","o":["在所有重大方面公允反映了被审计单位的财务状况、经营成果和现金流量","存在重大不确定事项","不能获取充分、适当的审计证据","未能在所有重大方面公允反映被审计单位的财务状况、经营成果和现金流量"],"a":[0],"e":"该题考查审计报告的基本类型。注册会计师经过审计后，认为被审计单位会计报表符合下列所有条件时，应当出具无保留意见的审计报告：(1)财务报表已经按照适用的会计准则和相关会计制度的规定编制，在所有重大方面公允反映了被审计单位的财务状况、经营成果和现金流量。(合法、公允)(2)注册会计师已经按照中国注册会计师审计准则的规定计划和实施审计工作，在审计过程中未受到限制。所以A项是正确选项。"},{"k":2,"d":0,"t":1,"s":"在影响企业发展能力的因素中（）是过去的决策和行为产生的结果。","o":["经营能力","人力资源","财务状况","企业制度"],"a":[2],"e":"该题考查影响企业发展能力的因素。财务状况是过去的决策和行为产生的结果，而其他因素则是影响企业未来财务状况的动因。所以C项是正确选项。"},{"k":2,"d":0,"t":1,"s":"某企业税后利润为140万元，所得税率为30%，利息费用40万元，则企业的已获利息倍数为（）","o":["2.05","4.5","1.9","6"],"a":[3],"e":"该题考查已获利息倍数计算的理解。利息保障倍数(已获利息倍数)=[140/(1一30%)+40]-40=6万元。所以D项是正确选项。"},{"k":2,"d":0,"t":1,"s":"某企业销售收入为600万元，现销收入占销售收入的比重为80%，销售折让和折扣共计10万元，假设无销售退回，应收账款平均余额为10万元，则该企业的应收账款周转率为（）","o":["11","6","9","10"],"a":[0],"e":"该题考查应收账款周转率的计算。销收入净额=600×(1-80%)-10=110(万元)，应收账款周转率=110-10=11(次)。所以A项是正确选项"},{"k":2,"d":0,"t":1,"s":"某公司2003年销售收入为5000万，销售成本为4000万，2004年销售收入为8000万，销售成本为3000万，该公司2004年销售增长率是 （）","o":["40%","50%","60%","30%"],"a":[2],"e":"该题考查销售增长率的计算。销售增长率=(8000一5000)／5000=60%。所以C项是正确选项。"},{"k":2,"d":0,"t":1,"s":"某企业2008年销售成本为210万元，销售毛利率为30%，年未流动资产90万元，年初流动资产110万元，则该企业流动资产周转率为（）","o":["2次","3次","2.5次","2.78次"],"a":[1],"e":"该题考查企业流动资产周转率的计算。销售收入-销售成本=销售毛利=销售收入×销售毛利率，销售收入-210=销售收入×30%，所以：销售收入=210-(1-30%)=300万元，流动资产周转率=300-[(90+110)-2]=3次。所以B项是正确选项。"},{"k":2,"d":0,"t":1,"s":"甲企业年初流动比率为2.2，速动比率为1，年未流动比率为2.5，速动比率为0.5。发生这种变化的原因是（）","o":["应付账款增加","应收账款增加","当年存货增加","应收账款周转加快"],"a":[2],"e":"该题考查流动比率计算的理解。流动比率上升而速动比率下降，很可能是存货增加，而速动资产下降导致。本题中若流动负债不变，存货增加，流动比率会增加；而存货的增加需要付出货币资金，则速动资产减少，所以比种情况会导致流动比率增加、速动比率下降。速动比率由1下降到0.5。所以C项是正确选项。"},{"k":2,"d":0,"t":1,"s":"以下属于流动资产周转情况的指标主要有（）","o":["流动比率","现金比率","应收账款周转率","净资产收益率"],"a":[2],"e":"该题考查流动资产周转情况的指标有哪些。反映流动资产周转情况的指标主要有应收账款周转率、存货周转率、营业周期、现金周期、营运资本周转率、流动资产周转率。所以C项是正确选项。"},{"k":2,"d":0,"t":1,"s":"总资产收益率指标的分母为 （）","o":["期初资产总值","期末资产总值","总资产平均额","可任意选用"],"a":[2],"e":"该题考查总资产收益率公式的理解。总资产收益率(又称资产利润率或资产收益率)=净利润／总资产平均额×100%。所以C项是正确选项。"},{"k":2,"d":0,"t":1,"s":"净资产收益率是权益乘数与下列哪一项的乘积（）","o":["销售净利率","总资产周转率","总资产收益率","加权平均净资产收益率"],"a":[2],"e":"该题考查净资产收益率公式的理解。净资产收益率=总资产收益率×权益乘数。所以C项是正确选项。"},{"k":2,"d":0,"t":1,"s":"最可信任的评价公司短期偿债能力强弱指标是（）","o":["流动比率","速动比率","已获利息倍数","现金比率"],"a":[3],"e":"该题考查现金比率分析意义的理解。现金比率是最可信任的评价公司短期偿债能力强弱指标。所以D项是正确选项。"},{"k":2,"d":0,"t":1,"s":"为了衡量企业整体业绩，应选择（）作为计量投资报酬的基数。","o":["长期资金","流动负债","全部资金","权益资金"],"a":[2],"e":"该题考查对投入资金的理解。一个企业投入资金通常包括：流动负债、长期负债、优先股权益和普通股权益。究竟选择哪些资金作为计量投资存在的资产总额，包括债权人和股东投资的全部资金，以此为基数，可以衡量企业整体业绩。所以C项是正确选项。"},{"k":2,"d":0,"t":1,"s":"下列各项中,不会影响流动比率的业务是（）","o":["用现金购买短期债券","用现金购买固定资产","用存货进行对外长期投资","从银行取得长期借款"],"a":[0],"e":"该题考查现流动比率分析的理解。其中：流动资产包括货币资金、短期投资、应收票据、应收账款、其他应收款、存货等，流动负债包括短期借款、应付票据、应付账款、其他应付款、应付利息、应付股利、应付税费、应付职工薪酬，流动资产通常指流动资产净额。所以A项是正确选项。"},{"k":2,"d":0,"t":1,"s":"总资产收益率指标中的利润是指（）","o":["税后利润","税后净利加利息","净利润加所得税","以上均可"],"a":[3],"e":"该题考查总资产收益率指标的理解。总资产收益率的表现形式(1)以净利润作为收益：理论依据是企业归投资人所有，企业的收益应该是归投资人所拥有的净利润，因此企业的收益的计算就应该将所得税和筹资方式的影响都考虑在内。（2)以税前息后利润作为收益：理论依据是：企业收益应该是收入与费用相抵后的差额，即利润总额，无论归投资人所有的净利润还是上交国家的所得税都是企业收益的组成部分，所以收益的计算应该排除所得税率影响而不排除筹资方式的影响。总资产收益率=(净利润+所得税)/总资产平均余额×100%(3)以税后息前利润作为收益：理论依据是企业的资产是归投资人和债权人共同所有的，企业的收益就应该由归投资人所有的净利润和归债权人所有的利息费用所组成，企业收益的计算排除筹资方式而包含所得税税率影响。所以D项是正确选项。"},{"k":2,"d":0,"t":1,"s":"普通股每股股利简称每股股利，它反映每股普通股获得现金股利的情况，其公式为（）","o":["股利总额/发行在外普通股股数","股票股利/发行在外普通股股数","现金股利总额/发行在外普通股股数","现金股利总额/发行在外普通股平均股数"],"a":[2],"e":"该题考查每股股利公式的理解。每股股利=现金股利总额/发行在外普通股股数。注意分母采用年未发行在外的普通股股数，而不是全年发行在外的平均股数。所以C项是正确选项。"},{"k":2,"d":0,"t":1,"s":"建立在个别产品生命周期与产业生命周期具有一致性假设基础之上的产品生命周期分析判断方法是（）","o":["直接参考法","指标分析法","直接判断法","指数平滑法"],"a":[0],"e":"该题考查产品生命周期的分析与判断的方法。直接参考法是直接参考国外或其他地区同类产品的生命周期来确定本企业产品生命周期所处阶段的一种方法。建立在个别产品生命周期产业生命周期具有一致性的假设基础之上。所以A项是正确选项。"},{"k":2,"d":0,"t":1,"s":"关于营业资本的下列表述中正确的是（）","o":["营运资本是资产总额减长期负债总额后的剩余部分","营运资本指标的分析一般只进行横向比较","营业资本越低越好","对企业来说，过多持有营运资本可能会降低企业的盈利能力"],"a":[3],"e":"纵向比较，很少进行横向比较；对于短期债权人来说，营运资本越高越好；对于企业来说，过多持有营运资本财务风险降低了，但可能会降低企业的盈利能力。所以D项是正确选项。"},{"k":2,"d":0,"t":1,"s":"以下属于影响企业营运能力的内部因素是（）","o":["行业特性","经营背景","企业资产管理政策","文化环境"],"a":[2],"e":"该题考查影响企业营运能力的因素的理解。行业特性和经营背景属于外部因素，文化环境不直接影响营运能力。所以C项是正确选项。"},{"k":2,"d":0,"t":1,"s":"某公司无优先股，上年每股盈余4元，每股发放股利2元，保留盈余在过去一年中增加了500万元，年底每股账面价值为20元，负债总额为5000万元，则该公司的资产负债率为（）","o":["50%","33%","40%","44%"],"a":[0],"e":"该题考查资产负债率计算的理解。总股数500/(4-2)=250万股，所有者权益总额250*20=5000万元，资产负债率5000/5000+5000)=50%。所以A项是正确选项。"},{"k":2,"d":0,"t":1,"s":"下列流动资产项目中，变现能力最强的是（）","o":["短期投资","货币资金","应收账款","预付账款"],"a":[1],"e":"该题考查对流动资产中变现能力强弱的理解。在流动资产中变现能力由强到弱排列如下：货币资金；短期投资；应收票据；应收账款和其他应收款等应收款项；预付账款；存货。所以B项是正确选项。"},{"k":2,"d":0,"t":1,"s":"某企业2008年初与年末所有者权益分别为240万元和268万元，不考虑客观因素的影响，则资本保值增值率为（）","o":["112%","120%","150%","20%"],"a":[0],"e":"该题考查资本保值增值率的计算。资本保值增值率=268/240=112%。所以A项是正确选项。"},{"k":2,"d":0,"t":1,"s":"将企业连续几个期间的相关财务数据进行对比，得出企业盈利能力的变化趋势，这是盈利能力分析方法的（）","o":["比率分析","趋势分析","结构分析","对比分析"],"a":[1],"e":"该题考查盈利能力分析方法的理解。盈利能力的趋势分析就是将企业连续几个期间的相关财务数据进行对比，得出企业盈利能力的变化趋势。所以B正确。"},{"k":2,"d":0,"t":1,"s":"某企业2007年末固定资产原价1500000元，累计折日500000元；2007年年初固定资产原价1450000元，累计折旧日480000元;2007年主营业务收入1400000元，则该企业2007年固定资产周转天数为（）","o":["253.3天","295.5天","442.5天","312天"],"a":[0],"e":"该题考查固定资产周转天数的计算。固定资产平均余额=【(1500000-500000)+(1450000-480000)】/2=985000元，固定资产周转天数=360*985000/1400000=253.3天。所以A项是正确选项。"},{"k":2,"d":0,"t":1,"s":"甲上市公司2007年度的财务报告于2008年2月15日编制完成，注册会计师完成整个年度审计工作并签署审计报告的日期为2008年4月18日，董事会批准财务报告对外公布的日期为2008年4月22日，财务报告实际对外公布的日期为2008年4月25日，股东大会召开日期为2008年5月6日。资产负债表日后事项涵盖的期间为（）","o":["2008年2月15日至2008年4月22日","2008年1月1日至2008年4月22日","2008年1月1日至2008年5月6日","2008年1月1日至2008年4月25日"],"a":[1],"e":"该题考查资产负债表日事项的含义。根据资产负债表日后事项涵盖期间的规定，本例中财务报告批准报出日为2008年4月22日，资产负债表日后事项涵盖的期间为2008年1月1日至2008年4月22日。所以B项是正确选项。"},{"k":2,"d":0,"t":1,"s":"某企业2007年主营业务收入净额为48000万元，流动资产平均余额为2000万元，固定资产平均余额为8000万元。假定没有其他资产，则该企业2007年的总资产周转率为（）次。","o":["4.8","2.4","2.9","3.6"],"a":[0],"e":"该题考查总资产周转率的计算。48000-(2000+8000)=4.8。所以A项是正确选项。"},{"k":2,"d":0,"t":1,"s":"存货周转率偏高的原因可能是（）","o":["信用政策过严","出现了冷背残次存货","存货不适应生产销售需要","采购批量太小"],"a":[3],"e":"该题考查对存货周转情况的分析。注意存货周转率过高，也不能完全说明企业的存货状况很好，有可能是由于企业的存货水平太低所致。存货水平太低有可能是由于企业的采购批量太小，采购过于频繁，可能会增加企业的采购成本，而且存货水平太低可能会导致缺货，影响企业正常生产。所以D项是正确选项。"},{"k":2,"d":0,"t":1,"s":"1某企业期初应收账款余额350万元，期末应收账款余额250万元，本期产品销售收入为1200万元，本期产品销售成本为1000万元，则该企业应收账款周转率为（）","o":["4次","4.8次","5次","6次"],"a":[0],"e":"该题考查应收账款平均余额计算的计算。应收账款平均余额=(350+250)-2=300(万元)，应收账款周转率=1200-300=4(次)。所以A项是正确选项。"},{"k":2,"d":0,"t":1,"s":"排除所得税率和筹资方式影响的收益形式是（）","o":["净利润","税前息后利润","息税前利润","税后息前利润"],"a":[2],"e":"该题考查对总资产收益率的表现形式的理解。理论依据是无论是归投资人所有的净利润，还是向国家缴纳的所得税和支付给债权人的利息，都是企业运用资产所获得的收益一部分，因此收益的计算应排除所得税率和筹资方式的影响。总资产收益率=(净利润+利息+所得税)/总资产平均余额×100%。所以C项正确。"},{"k":2,"d":0,"t":1,"s":"以下属于资产负债表日后事项中调整事项的是（）","o":["已证实的资产发生了减值或原先确认的减值金额需要调整","资产负债表日后发生重大诉讼、仲裁、承诺","资产负债表日后因自然灾害导致资产发生重大损失","资产负债表日后发行股票和债券以及其他巨额举债"],"a":[0],"e":"该题考查资产负债表日后事项的理解。资产负债表日后发生重大诉讼、仲裁、承诺；资产负债表日后因自然灾害导致资产发生重大损失和资产负债表日后发行股票和债券以及其他巨额举债都属于非调整事项。所以A项是正确选项。"},{"k":2,"d":0,"t":1,"s":"列关于每股收益的说法正确的有（）","o":["该比率反映普通股的获利水平","该比率可以反映风险","该比率在不同时期不可比","该比率可反映股东获得的现实财富"],"a":[0],"e":"该题考查现流动比率分析的理解。每股收益反映普通股的获利水平，该比率无法反映风险水平的高低；该比率可以进行横向和纵向比较，该比率无法反映股东获得的现实财富(如股利、资本利得等属于股东现实财富)。所以A项是正确选项。"},{"k":2,"d":0,"t":1,"s":"经营活动产生的现金流量净额扣除优先股股利之后，与普通股发行在外的平均股数对比的结果称为（）","o":["现金流量利息保障倍数","资产现金流量收益率","每股现金流量","每股收益"],"a":[2],"e":"该题考查每股现金流量含义的理解。每股现金流量，是经营活动产生的现金流量净额扣除优先股股利之后，与普通股发行在外的平均股数对比的结果。 所以C项是正确选项。"},{"k":2,"d":0,"t":1,"s":"在销售收入既定的条件下，会引起总资产周转次数下降的经济业务是（）","o":["收回应收账款","计提坏账准备","以存款购入设备","获得一笔银行借款"],"a":[3],"e":"该题考查经营活动的含义的理解。总资产周转次数=销售收入/平均资产总额，总资产由各项资产组成，在销售收入既定的条件下，总资产周转率的驱动因素是各项资产。AC均不会导致总资产发生变化；B导致总资产下降，总资产周转次数上升；D导致总资产增加，总资产周转次数下降。所以D项是正确选项。"},{"k":2,"d":0,"t":1,"s":"杜邦分析法的核心指标是（）","o":["权益收益率","资产净利率","权益乘数","资产周转率"],"a":[0],"e":"该题考查对杜邦分析法的理解。杜邦分析法的核心指标是权益收益率。所以A项是正确选项。"},{"k":2,"d":0,"t":1,"s":"下列指标中，不能用来分析企业短期偿债能力的是（）","o":["流动比率","股权比率","速动比率","现金比率"],"a":[1],"e":"该题考查短期偿债能力分析指标的理解。股权比率是长期偿债能力的分析指标。所以B项是正确选项。"},{"k":2,"d":0,"t":1,"s":"某企业营业利润为100万元，营业外支出净额为20万元，利息费用为10万元，当年的资产负债率为50%，总资产平均余额为4000万元，负债由短期负债和长期负债构成，其中长期负债占80%，则该企业的长期资金收益率为（）","o":["5.56%","3.61%","6.67%","7.22%"],"a":[1],"e":"该题考查长期资金收益率的计算。息税前利润=营业利润+营业外收支净额+利息费用=100+20+10=130万元，负债总额=4000×50%=2000万元，股东权益总额=2000万元，长期负债=2000×80%=1600万元，平均的长期资金=2000+1600=3600万元长期资金收益率=息税前利润/平均的长期资金×100%=130/3600×100%=3.61%所以B项是正确选项。"},{"k":2,"d":0,"t":1,"s":"（）是指产品在市场上的销售情况及获利能力随时间的推移而从诞生、成长到成熟、最终走向衰亡的演变过程。","o":["经济周期","产业生命周期","产品生命周期","生命周期"],"a":[2],"e":"该题考查对产品生命周期概念的理解。产品生命周期是指产品在市场上的销售情况及获利能力随时间的推移而从诞生、成长到成熟、最终走向衰亡的演变过程。所以C项是正确选项。"},{"k":2,"d":0,"t":1,"s":"在计算速动比率时，要把一些项目从流动资产中剔除的原因不包括（）","o":["可能存在部分存货变现净值小于账面价值的情况","部分存货可能属于安全库存","预付账款的变现能力较差","存货可能采用不同的评价方法"],"a":[3],"e":"该题考查对速动资产扣除项目的理解。速动资产是流动资产减去变现能力较差且不稳定的预付账款、存货、其他流动资产等项目后的余额。之所以要扣除这些是因为这些资产变现能力相对于其他流动资产来说要更差一些。所以D项是正确选项。"},{"k":2,"d":0,"t":1,"s":"某支股票每股市价为10元，每股收益为0.5元，每股股利为0.2元，则下列表述错误的是（）","o":["股利收益率为2%","股利发放率为5%","市盈率为20","股利发放率=市盈率*股利收益率"],"a":[1],"e":"该题考查与股本有关的盈利能力指标的理解。股利收益率=每股股利/每股市价=0.2-10×100%=2%，股利发放率(股利支付率)=每股股利/每股收益=0.2/0.5×100%=40%，市盈率=每股市价/每股收益=10/0.5×100%=20，股利发放率=市盈率×股利收益率=20×2%=40%。所以B项是正确选项。"},{"k":2,"d":0,"t":2,"s":"根据《企业会计准则第28号会计政策、会计估计变更和差错更正》，企业应当披露的重要会计政策包括（）","o":["长期股权投资的后续计量","发出存货成本的计量","无形资产的确认","投资性房地产的后续计量","合同收入与费用的确认"],"a":[0,1,2,3,4],"e":"该题考查《企业会计准则第28号会计政策、会计估计变更和差错更正》，企业应当披露的重要会计政策的理解。根据《企业会计准则第28号一一会计政策、会计估计变更和差错更正》，企业应当披露的重要会计政策包括：（1)发出存货成本的计量，(2)长期股权投资的后续计量，(3)投资性房地产的后续计量，(4)固定资产的初始计量，(5)生物资产的初始计量，(6)无形资产的确认；(7)非货币性资产交换的计量，(8)收入的确认是指收入确认所采用的会计原则；(9)合同收入与费用的确认，（10)借款费用的处理，（11)合并政策。所以ABCDE项是正确选项。"},{"k":2,"d":0,"t":2,"s":"企业营业发展能力分析的内容包括（）","o":["对净资产规模增长的分析","对利润增长的分析","对销售增长的分析","对股利增长的分析","对资产规模增长的分析"],"a":[2,4],"e":"该题考查营运能力分析目的的理解。企业营业结果可以通过销售收入和资产规模的增长体现出来，所以企业营业增长能力分析可以分为对销售增长的分析和对资产规模增长的分析。CE是正确选项。"},{"k":2,"d":0,"t":2,"s":"下列关于流动资产周转率的正确说法有（）","o":["计算流动资产周转率时，周转额为一定期间内取得的主营业务收入","周转次数与周转天数成反比","流动资产周转率并非越高越好，流动资产周转率过高表示流动资产未充分利用","流动资产周转率的高低，应结合企业历史资料或行业水平判断","流动资产周转率与应收账款周转率的高低无关"],"a":[0,1,3],"e":"该题考查流动资产周转率的理解。流动资产周转率过高，表明流动资产利用的越充分，而流动资产周转率过低，表明流动资产未充分利用，所以C错误。流动资产周转率应和应收账款周转率、存货周转率结合分析才能分析更透彻。所以ABD项是正确选项。"},{"k":2,"d":0,"t":2,"s":"从资产负债表中获取数据的长期偿债能力指标有（）","o":["权益乘数","已获利息倍数","资产负债率","有形净值债务率","速动比率"],"a":[0,2,3],"e":"该题考查长期偿债能力指标的理解。已获利息倍数是从利润表中获取数据的长期偿债能力指标，速动比率是短期偿债能力。所以ACD项是正确选项。下列各项中，与净资产收益率密切相关的有（)您答对了销售净利率总资产周转率总资产增长率权益乘数资本保值增值率答案解析:该题考查对杜邦分析法理解。决定权益净利率的因素有三个方面：销售净利率、总资产周转率和权益乘数。因此ABD是正确答案。"},{"k":2,"d":0,"t":2,"s":"关于未来适用法以下正确的表述有（）","o":["将变更后的会计政策应用于变更日及以后发生的交易或者事项的方法","在会计估计变更当期和未来期间确认会计估计变更影响数的方法","调整会计估计变更当期期初留存收益","对变更年度资产负债表年初余额进行调整","对变更年度利润表上金额进行调整"],"a":[0,1],"e":"期间确认会计估计变更影响数的方法。C、D、E选项是有关追溯调整法的表述，因此是错误的。所以AB项是正确选项。"},{"k":2,"d":0,"t":2,"s":"下列各项中，属于企业负债的有（）","o":["企业购买的国债","企业欠职工的工资","企业欠银行的贷款","企业签订的采购合同","企业负责人个人购房时向朋友的借款"],"a":[1,2],"e":"本题考查的是企业的负债，会计主体是企业，所以企业的负责人、老板等的个人债务并不属于企业的债务，所以选项E不正确；A是企业的资产，属于国家欠企业的负债，而不属于企业的负债；D项是将来发生的，不符合负债的定义，所以D不是答案，属于企业负债的就是选项B和C。所以BC项是正确选项。"},{"k":2,"d":0,"t":2,"s":"下列关于短期偿债能力和长期偿债能力的表述正确的有（）","o":["短期偿债能力着重进行静态分析","企业资产和负债结构以及盈利能力是长期偿债能力的决定因素","短期偿债能力与长期偿债能力越高越好","短期偿债能力是长期偿债能力的基础","长期偿债能力所涉及的债务偿付一般为流动性支出"],"a":[0,1,3],"e":"该题考查短期偿债能力和长期偿债能力的理解。短期偿债能力与长期偿债能力如果是站在债权人角度来看是越高越好，但是如果从企业角度可能说明企业没有充分利用债务的杠杆作用为企业获利，影响企业的盈利能力，所以C不正确；长期偿债能力所涉及的债务偿付一般为固定性支出，所以E项不正确。所以ABD项是正确选项。"},{"k":2,"d":0,"t":2,"s":"下列事项属于关联方交易的是（）","o":["企业向其关键管理人员支付薪酬","母公司为子公司提供债务担保","企业向其主要供应商采购商品","企业向其子公司销售商品","母公司代表子公司进行债务结算"],"a":[0,1,3,4],"e":"该题考查关联方交易的理解。与企业发生大量交易而存在经济依存关系的供应商不属于企业的关联方，所以企业向其主要供应商采购商品不属于关联交易。所以ABDE项是正确选项。"},{"k":2,"d":0,"t":2,"s":"下列关于影响盈利能力的因素表述正确的有（）","o":["通常情况下，独特的盈利模式能够增强企业的盈利能力","通常情况下，资产的运转效率越高，企业的盈利能力越强","当企业的资产报酬率小于企业借款利息率时，企业负债经营可以提高企业的获利能力","如果企业的利润主要来源于一些非经常性项目，则利润结构往往存在较大的风险，也不能反映出企业的真实盈利能力","通常情况下，符合国家税收优惠政策的企业能够享受税收优惠，增强企业的盈利能力"],"a":[0,1,3,4],"e":"以ABDE项是正确选项。"},{"k":2,"d":0,"t":2,"s":"企业发生的资产负债表日后非调整事项，通常包括（）","o":["资产负债表日后发生重大诉讼、仲裁、承诺","资产负债表日后资本公积转增资本","资产负债表日后发生企业合并或处置子公司","资产负债表日后发生巨额亏损","资产负债表日后发现报告期或以前期间存在的财务报表舞或差错"],"a":[0,1,2,3],"e":"该题考查资产负债表日后非调整事项的理解。E属于资产负债表日后调整事项。所以ABCD项是正确选项。"},{"k":2,"d":0,"t":2,"s":"下列各项中指标越小越好的有（）","o":["流动资产周转天数","流动资产周转率","应收账款周转天数","营业周期","存货周转率"],"a":[0,2,3],"e":"该题考查各项指标的综合理解。流动资产周转率和存货周转率都是越大越好。所以ACD项是正确选项。"},{"k":2,"d":0,"t":2,"s":"一般情况下，固定资产周转率越高，说明（）","o":["企业固定资产投资得当","固定资产结构分布合理","固定资产利用充分","能够较充分地发挥固定资产的适用效率","企业的经营活动越有效"],"a":[0,1,2,3,4],"e":"该题考查固定资产周转率的理解。一般来说，固定资产周转率高，固定资产周转天数短，说明固定资产周转快，利用充分；反之，亦然，如果固定资产周转过快，需要结合企业具体情况分析原因，看是否生产能力饱和，是否需要增加或更新设备。企业要提高固定资产周转率，就应加强对固定资产的管理，做到固定资产投资规模得当，结构合理。所以ABCDE项是正确选项。"},{"k":2,"d":0,"t":2,"s":"关于沃尔评分法，下列说法中正确的有（）","o":["沃尔评分法的优点是简单易用，便于操作","沃尔评分法能够证明各个财务比率所占权重的合理性","财务比率的标准值通常是行业平均水平","企业的综合得分如果明显超过100分，则说明企业的综合财务状况优于标准水平","在沃尔评分法的各个步骤中，最为关键的是各项财务比率权重和标准值的确定"],"a":[0,2,3,4],"e":"该题考查沃尔评分法理论的理解。沃尔评分法理论上存在着一定的缺陷即未能说明为什么选择这7人比率，而不是更多或者更少，或者选择其他财务比率；它未能证明各个财务比率所占权重的合理性；它也未能说明比率的标准值是如何确定的。所以ACDE项是正确选项。"},{"k":2,"d":0,"t":2,"s":"以下反映企业获利能力的财务比率是（）","o":["资本保值增值率","利息保障倍数","销售净利率","应收账款周转率","资产现金流量收益率"],"a":[0,2,4],"e":"该题考查企业获利能力的财务比率的理解。利息保障倍数是偿债能力分析指标，应收账款周转率是企业营运能力分析的指标。所以ACE项是正确选项。"},{"k":2,"d":0,"t":2,"s":"短期偿债能力的影响因素有 （）","o":["流动资产的规模与质量","流动负债的规模与质量","企业的经营现金流量","企业的规模","企业的信用"],"a":[0,1,2],"e":"该题考查短期偿债能力的影响因素的理解。短期偿债能力的影响因素：①流动资产的规模与质量；②流动负债的规模与质量；③企业的经营现金流量。所以ABC项是正确选项。"},{"k":2,"d":0,"t":2,"s":"正常状态下的债务一般通过（）方式偿付。","o":["留存的货币资金","借取新债","债转股","其他资产转换的现金","修改债务条件"],"a":[0,1,3],"e":"该题考查债务的偿付方式理解。正常状态下的债务一般通过现金方式偿付，包括留存的货币资金、借取新债、其他资产转换的现金。对于CE属于非正常状态下债务的偿付方式。所以ABD项是正确选项。"},{"k":2,"d":0,"t":2,"s":"短期偿债能力的指标有（）","o":["资产负债率","现金比率","已获利息倍数","流动比率","速动比率"],"a":[1,3,4],"e":"该题考查短期偿债能力的指标的理解。资产负债率、已获利息倍数都属于长期偿债能力。所以BDE项是正确选项。"},{"k":2,"d":0,"t":2,"s":"影响营业周期计算结果的因素有（）","o":["存货计价方法","营业年度的选择","应收账款周转天数","现金比率","存货周转率"],"a":[0,1,2,4],"e":"该题考查营业周期的理解。经现金比率反映偿债能力。所以ABCE项是正确选项。"},{"k":2,"d":0,"t":2,"s":"非无保留意见的审计报告包括（）","o":["标准审计报告","保留意见审计报告","否定意见审计报告","无法表示意见审计报告","带强调事项段无保留意见审计报告"],"a":[1,2,3],"e":"该题考查非无保留意见的审计报告的理解。非无保留意见的审计报告包括：保留意见审计报告、否定意见审计报告和无法表示意见审计报告所以BCD项是正确选项。"},{"k":2,"d":0,"t":2,"s":"企业周期分析的重点应是（）","o":["经济周期","企业生命周期","产品生命周期","产业生命周期","产品市场寿命"],"a":[1,2,4],"e":"该题考查企业周期分析的理解。经济周期与产业生命周期属于宏观环境的特征和发展趋势，应由政府服务部门或研究机构完成。企业生命周期和产品生命周期属于企业自身微观环境特征与发展趋势应由企业重点分析。产品生命周期指的是产品市场寿命。所以本题选择BCE。所以BCE项是正确选项。"},{"k":2,"d":0,"t":2,"s":"下列项目属于流动负债的有（）","o":["长期应付款","预付账款","预收账款","应交税费","应付账款"],"a":[2,3,4],"e":"该题考查流动负债的理解。A属于长期负债；B属于流动资产；CDE属于企业的流动负债。所以CDE项是正确选项。"},{"k":2,"d":0, /* ---------------- 进度存档码 ---------------- */
var B64='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
function b64e(s){var o='',i=0,a,b,c;
  while(i<s.length){a=s.charCodeAt(i++)&255;
    b=i<s.length?s.charCodeAt(i++)&255:NaN;
    c=i<s.length?s.charCodeAt(i++)&255:NaN;
    o+=B64.charAt(a>>2);
    o+=B64.charAt(((a&3)<<4)|(isNaN(b)?0:b>>4));
    o+=isNaN(b)?'=':B64.charAt(((b&15)<<2)|(isNaN(c)?0:c>>6));
    o+=isNaN(c)?'=':B64.charAt(c&63);}
  return o;}
function b64d(s){var v=[],i,x;
  for(i=0;i<s.length;i++){x=B64.indexOf(s.charAt(i));if(x>=0)v.push(x);}
  var o='';
  for(i=0;i+1<v.length;i+=4){
    o+=String.fromCharCode((v[i]<<2)|(v[i+1]>>4));
    if(i+2<v.length)o+=String.fromCharCode(((v[i+1]&15)<<4)|(v[i+2]>>2));
    if(i+3<v.length)o+=String.fromCharCode(((v[i+2]&3)<<6)|v[i+3]);}
  return o;}
function exportCode(){
  var w=[],r=[],k;
  for(k in W){if(byId[k])w.push((byId[k].n-1)+':'+(W[k].c||1));}
  for(k in R){if(byId[k])r.push(byId[k].n-1);}
  /* 末尾 R 标记之后是"做对过"的题号；旧版进度码没有这一段，解析时按缺失处理 */
  return 'CQ1|'+b64e(SEQ.i+','+STAT.ans+','+STAT.ok+','+w.length+','+w.join(',')
    +',R,'+r.length+(r.length?','+r.join(','):''));
}
function importCode(code){
  code=(code||'').replace(/\s/g,'');
  if(code.indexOf('CQ1|')!==0)throw new Error('格式不对');
  var p=b64d(code.slice(4)).split(',');
  if(p.length<4)throw new Error('内容不完整');
  var i=parseInt(p[0],10)||0, ans=parseInt(p[1],10)||0, ok=parseInt(p[2],10)||0;
  var n=parseInt(p[3],10)||0, j, ab, idx;
  var ri=-1;
  for(j=4;j<p.length;j++){if(p[j]==='R'){ri=j;break;}}
  var wend=(ri<0?p.length:ri);
  var w2={}, got=0;
  for(j=4;j<wend;j++){
    if(!p[j])continue;
    ab=p[j].split(':');
    idx=parseInt(ab[0],10);
    if(isNaN(idx)||!BANK[idx])throw new Error('第 '+(j-3)+' 条错题记录越界');
    w2[BANK[idx].id]={c:parseInt(ab[1],10)||1,t:0};
    got++;
  }
  if(got!==n)throw new Error('错题条数对不上（应有 '+n+' 条，实际 '+got+' 条）');
  var r2={};
  if(ri>=0){
    var rn=parseInt(p[ri+1],10)||0, rgot=0;
    for(j=ri+2;j<p.length;j++){
      if(!p[j])continue;
      idx=parseInt(p[j],10);
      if(isNaN(idx)||!BANK[idx])throw new Error('第 '+(rgot+1)+' 条答对记录越界');
      r2[BANK[idx].id]=1; rgot++;
    }
    if(rgot!==rn)throw new Error('答对条数对不上（应有 '+rn+' 条，实际 '+rgot+' 条）');
  }
  return {seq:i,ans:ans,ok:ok,w:w2,r:r2};
}
function copyFrom(id){
  var ta=document.getElementById(id);
  if(!ta)return;
  try{ta.focus();ta.select();}catch(e){}
  var done=false;

  if(done){toast('已复制到剪贴板');return;}
  if(typeof navigator!=='undefined'&&navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(function(){toast('已复制到剪贴板');},
      function(){toast('请长按上面的文字手动全选复制');});
    return;
  }
  toast('请长按上面的文字手动全选复制');
}

  PENDING='top';
  S={type:'type',list:shuffle(ids),i:0,pick:{},sel:{},
     mode:(t===2?'多选专项':'单选专项')};
  renderQuiz();
}
function startWrong(){
  var ids=wrongIds();
  if(!ids.length){toast('错题本是空的，先去刷题吧');return;}
  PENDING='top';
  S={type:'wrong',list:shuffle(ids),i:0,pick:{},sel:{},mode:'错题重做'};
  renderQuiz();
}
/* 从错题本点某一道题：以整个错题本为一组，从这道开始往后刷。
   只开一道题的话答对后没有"下一题"可跳，自动跳题就形同虚设 */
function startWrongAt(id){
  var ids=wrongIds(),idx=0,i;
  if(!ids.length){toast('错题本是空的，先去刷题吧');return;}
  for(i=0;i<ids.length;i++){if(ids[i]===id){idx=i;break;}}
  PENDING='top';
  S={type:'wrong',list:ids,i:idx,pick:{},sel:{},mode:'错题重做'};
  renderQuiz();
}
function home(){S=null;renderHome();toTop();}

/* 多选题勾选/取消（还没提交） */
function toggleSel(k){
  var id=S.list[S.i];
  var a=(S.sel[id]||[]).slice();
  var i=a.indexOf(k);
  if(i>=0)a.splice(i,1);else a.push(k);
  S.sel[id]=a;
  renderQuiz();
}
/* 提交作答：arr 是选项下标数组 */
function commit(arr){
  var id=S.list[S.i],q=byId[id];
  if(S.pick[id]!==undefined)return;
  var picked=up(arr);
  S.pick[id]=picked;
  var ok=arrEq(picked,q.a);
  STAT.ans++; if(ok)STAT.ok++; saveStat();
  /* 对错状态互斥：做对就移出错题本并记进"已做对"，做错反之 */
  if(ok){
    if(W[id]){delete W[id];saveW();}
    if(!R[id]){R[id]=1;saveR();}
  }else{
    if(R[id]){delete R[id];saveR();}
    W[id]={c:(W[id]?W[id].c:0)+1,t:Date.now()};saveW();
  }
  if(S.type==='seq'){SEQ.i=S.i;save(K_S,SEQ);}
  sessionAnswered++;
  if(!storeOK&&!reminded&&sessionAnswered>=5){
    reminded=true;
    toast('提示：本次进度不会自动保存，记得点底部按钮存进度码');
  }
  PENDING='fb';
  renderQuiz();
  if(ok&&CFG.auto&&S.i<S.list.length-1){
    autoT=setTimeout(function(){autoT=null;go(1);},AUTO_MS);
  }
}
function submitMulti(){
  var id=S.list[S.i];
  var sel=S.sel[id]||[];
  if(!sel.length){toast('请先选择至少一个选项');return;}
  commit(sel);
}
function go(d){
  var n=S.i+d;
  if(n<0||n>=S.list.length)return;
  PENDING='top';
  S.i=n;
  if(S.type==='seq'){SEQ.i=n;save(K_S,SEQ);}
  renderQuiz();
}
function jump(){
  modal({title:'跳转',body:'<p>要跳到第几题？（共 '+S.list.length+' 题）</p>',
    input:true,type:'number',value:''+(S.i+1),placeholder:'1 - '+S.list.length,
    onOk:function(v){
      var n=parseInt(v,10);
      if(isNaN(n)||n<1||n>S.list.length){
        toast('请输入 1 到 '+S.list.length+' 之间的数字');return false;}
      PENDING='top';
      S.i=n-1;
      if(S.type==='seq'){SEQ.i=S.i;save(K_S,SEQ);}
      renderQuiz();}});
}
function finishQuiz(){
  var un=0,i;
  for(i=0;i<S.list.length;i++){if(S.pick[S.list[i]]===undefined)un++;}
  if(un){
    ask('确认交卷','还有 <b>'+un+'</b> 题没有作答，确定现在交卷吗？','交卷',function(){
      renderResult();});
    return;
  }
  renderResult();
}

/* ---------------- 事件 ---------------- */
document.addEventListener('click',function(e){
  var el=e.target&&e.target.closest?e.target.closest('[data-act]'):null;
  if(!el)return;
  var act=el.getAttribute('data-act');
  clearAuto();   /* 用户一动手就取消自动跳转 */
  if(act==='home'){home();return;}
  if(act==='seq'){startSeq();return;}
  if(act==='rand'){startRandom();return;}
  if(act==='multi'){startType(2);return;}
  if(act==='single'){startType(1);return;}
  if(act==='wrong'){S=null;renderWrong();return;}
  if(act==='redo'){startWrong();return;}
  if(act==='one'){startWrongAt(el.getAttribute('data-id'));return;}
  if(act==='exp'){doExport();return;}
  if(act==='imp'){doImport();return;}
  if(act==='auto'){CFG.auto=CFG.auto?0:1;save(K_C,CFG);renderHome();return;}
  if(act==='ov'){S=null;renderOverview();return;}
  if(act==='ovback'){S=null;renderOverview();return;}
  if(act==='wrongback'){S=null;renderWrong();return;}
  if(act==='ovf'){OVF=el.getAttribute('data-k');renderOverview();return;}
  if(act==='ovgo'){startOverviewQuiz(el.getAttribute('data-id'));return;}
  if(act==='ovredo'){
    var ids=idsByStatus(OVF);
    if(!ids.length){toast('这一栏里还没有题目');return;}
    PENDING='top';
    S={type:'ov',list:ids,i:0,pick:{},sel:{},mode:'答题总览'};
    renderQuiz();return;}
  if(act==='stay'){S.stayId=S.list[S.i];renderQuiz();
    toast('已停下，看完解析再点「下一题」');return;}
  if(act==='clearw'){
    ask('清空错题本','确定清空错题本吗？此操作不可撤销。','清空',function(){
      W={};saveW();renderWrong();});
    return;
  }
  if(act==='reset'){
    ask('清除全部记录','会同时清掉刷题进度、正确率统计、答题总览和错题本，且不可撤销。'
      +'<br>如需保留，请先<b>导出进度码</b>。','确定清除',function(){
      W={};R={};STAT={ans:0,ok:0};SEQ={i:0};
      saveW();saveR();saveStat();save(K_S,SEQ);renderHome();});
    return;
  }
  if(act==='pick'){
    var k=parseInt(el.getAttribute('data-k'),10);
    var q=byId[S.list[S.i]];
    if(S.pick[S.list[S.i]]!==undefined)return;
    if(q.t===2)toggleSel(k);else commit([k]);
    return;
  }
  if(act==='submitmulti'){submitMulti();return;}
  if(act==='prev'){go(-1);return;}
  if(act==='next'){go(1);return;}
  if(act==='jump'){jump();return;}
  if(act==='finish'){finishQuiz();return;}
});
document.addEventListener('keydown',function(e){
  if(!S)return;
  if(ov)return;
  clearAuto();
  var map={'1':0,'2':1,'3':2,'4':3,'5':4,'a':0,'b':1,'c':2,'d':3,'e':4,
           'A':0,'B':1,'C':2,'D':3,'E':4};
  var id=S.list[S.i],q=byId[id];
  if(map[e.key]!==undefined){
    var k=map[e.key];
    if(k<q.o.length&&S.pick[id]===undefined){
      if(q.t===2)toggleSel(k);else commit([k]);
      e.preventDefault();
    }
  }else if(e.key==='Enter'){
    if(q.t===2&&S.pick[id]===undefined)submitMulti();
    e.preventDefault();
  }else if(e.key==='ArrowRight'){go(1);e.preventDefault();}
  else if(e.key==='ArrowLeft'){go(-1);e.preventDefault();}
});

renderHome();

/* 只在 https 下注册 Service Worker（本地 file:// 打开时没必要也没有意义），
   让发布到 GitHub Pages 的版本可以"添加到主屏幕"并离线使用 */
if(location.protocol==='https:'&&typeof navigator!=='undefined'&&navigator.serviceWorker){
  try{navigator.serviceWorker.register('sw.js').then(null,function(){});}catch(e){}
}
